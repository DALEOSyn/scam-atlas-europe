    region: DE
    tier: 2
    used_for: [smishing-parcel-fee]
    notes: "Tier fixed in rework (was 1): a national government page carrying the national cyber agency's (BSI) warning. Historic baseline: parcel-themed SMS leading to a fake tracking app (Android) or phishing pages (iOS). If clicked: airplane mode, tell the mobile provider, check the bank, police report, factory reset only after the police are done."

  - id: de-vz-paketdienst-sms
    publisher: Verbraucherzentrale (federation of German consumer centres)
    title: "Paketdienst-SMS: Vorsicht, Abzocke!"
    url: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    published: 2026-07-22 (last updated)
    accessed: 2026-11-18
    region: DE
    tier: 3
    used_for: [smishing-parcel-fee, MAP-ch1, WHERE_TO_REPORT]
    notes: "Current variants: small 'customs' fee (~EUR 1-4); address fix with a 12/24h deadline; 'reply Y'; app install; personalised greetings from harvested contacts. The carrier normally collects customs at delivery; genuine pre-payment messages carry your tracking number and the sender's name. Habit: type the tracking number into the official site. Steps if clicked or paid: card block, chargeback, third-party billing block, police report."

