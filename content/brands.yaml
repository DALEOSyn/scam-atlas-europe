  - id: trundle
    name: "Trundle"
    sector: parcel courier / lockers
    role_in_game: >
      Courier in Berlin and later chapters: genuine locker notifications, app tracking ("open the app
      yourself"), and the brand most impersonated in parcel-fee smishing.
    domain: trundle.example
    app_name: "Trundle app"
    sms_sender_id: "TRUNDLE"
    known_channels: "Trundle app (in-game) and the typed address trundle.example. No phone number shown."
    palette:
      primary: "#0E5E63"       # petrol teal
      on_primary: "#FFFFFF"    # 7.50:1
      accent: "#A8E6CF"        # mint, non-text on primary 5.32:1
      text_on_light: "#0E5E63"
    logo: { lockup: public/brands/trundle.svg, mark: public/brands/trundle-mark.svg }
    typography: "Rounded system sans, extra-bold, all lowercase 'trundle'."
    rationale:
      name: >
        "To trundle" is to roll along slowly on wheels: a gentle joke for a courier. Language-neutral;
        no "Paket", "Post", "Express", "Parcel" or "Logistics".
      colour_shape: >
        Petrol teal + mint, a parcel on two wheels with dashed motion lines. Couriers in Europe cluster
        on yellow, red, brown, orange, purple+orange and blue+yellow. No horn, arrow, smile-arrow, wing,
        paper plane or globe.
      typography: "Lowercase rounded sans; regional couriers mostly use bold uppercase or italic wordmarks."
