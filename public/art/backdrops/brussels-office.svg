<!-- Scam Atlas: Europe. City backdrop: a small Brussels office two days before an open evening, a desk with a closed laptop and a small projector, plain stacked boxes of freshly printed covers, plants, a high window onto generic brick and stepped-gable roofs above head height; no lettering, no logo, no flag, no stars, no institution building. Original artwork written as SVG code by the project's AI-assisted team, element by element; no image-generation model, auto-vectorised raster, tracing, stock or reference photo. Fictional, not a likeness of any real person, sign or brand. CC BY-SA 4.0. -->
