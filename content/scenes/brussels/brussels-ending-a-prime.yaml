# Brussels ending A′ (GDD §30.6, STORY §3.10 part 1; sensitive; 3 panels of 4): the arc closed by a second
# Close at slot 1, with nothing in. Plays after Teo's chat (the reveal inside it) and the timeline.
# Teo's fixed line "Same picture, different name. Good thing I asked you." is split over two panels, word for
# word, to show "sheepish, then proud" (STORY §3.10).
# Psych note (GDD §30.14 item 9): "It's never too late to start" shows only to a player who has told nobody.
# R28 (T-3.13h): both lines are gated on the story flag arc_helped_teo (set by Teo's chat: the photo check
# together, or "Tell him to report the profile"), like ending A. With it: "Teo asked you, and you helped him.
# That's what works." Without it: "Telling someone early is what works. It's never too late to start." This is
# still only for a player who told nobody: an A′ player played only the slot-1 beat, closed both times (no
# report, no asking someone at an arc slot, no "Tell me now"), so arc_told_someone can only come from Teo's
# chat, from exactly the two outcomes that set arc_helped_teo; the two flags coincide in A′.
id: brussels-ending-a-prime
chapter: brussels
slot: resolution
sensitive: true
if_arc_ending: [A_prime]
panels:
  - backdrop: brussels-office
    crop: right
    speaker: teo
    expression: sheepish
    flip: true
    line: "Same picture, different name."
    alt: "Teo with a sheepish smile by the desk with the laptop, under the high window."
  - backdrop: brussels-office
    crop: left
    speaker: teo
    expression: proud
    line: "Good thing I asked you."
    alt: "Teo, proud, by the stacked boxes and the noticeboard."
  - backdrop: brussels-office
    crop: centre
    speaker: adaeze
    expression: calm
    if_flag: arc_helped_teo
    line: "Teo asked you, and you helped him. That's what works."
    alt: "Adaeze, calm, at the desk by the small projector, a high window behind her."
  - backdrop: brussels-office
    crop: centre
    speaker: adaeze
    expression: calm
    unless_flag: arc_helped_teo
    line: "Telling someone early is what works. It's never too late to start."
    alt: "Adaeze, calm, at the desk by the small projector, a high window behind her."
