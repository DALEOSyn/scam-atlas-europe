# Scenario template. Copy to content/scenarios/<city>/<id>.yaml
# All brands fictional (content/brands.yaml). Domains: .example/.test/.invalid only. IBANs must be checksum-invalid.
id: berlin-03-parcel-customs
chapter: berlin
pattern: smishing-parcel-fee          # id of docs/patterns/<id>.md
learning_objectives: [LO-02, LO-05]
difficulty: 2                         # 1 easy … 5 expert
is_fraud: true
device: sms                           # email | sms | messenger | call | browser | qr | banking | social
pressure: { timer_seconds: 45, levers: [urgency, small_amount] }

message:
  sender: { display: "Trundle", detail: "+49 ••• ••• 0173" }   # Trundle = fictional courier (content/brands.yaml)
  body: |
    Trundle: Ihr Paket wartet. Zollgebühr 1,99 EUR offen. Heute zahlen, sonst Rücksendung:
    trundle-zoll.example/p/8812
  l10n_note: "German in-world text intentional; EN translation shown on magnifier."

inspectables:                         # what the magnifier reveals; each red flag must point at one
  - target: sender.detail
    reveal: "A private mobile number, not the courier's short code."
    red_flag: true
  - target: link
    reveal: "trundle-zoll.example is not Trundle's site (trundle.example)."
    red_flag: true

actions:
  - id: tap_link
    label: "Open the link and pay €1.99"
    outcome: card_details_stolen
    score: -10
  - id: open_app
    label: "Open the Trundle app yourself and check the tracking"
    outcome: no_fee_found
    score: +15                        # the habit we teach scores highest
  - id: delete_report
    label: "Delete and report as spam"
    outcome: reported
    score: +10

outcomes:
  card_details_stolen:
    narrative: "Two days later, three payments you don't recognise appear on your card."
    recovery: [block_card_via_bank_app, call_bank_known_number, report_to_police_online]
  no_fee_found:
    narrative: "The app shows your parcel is already in the locker. No fee."
  reported:
    narrative: "Message reported. Your carrier blocks the sender."

debrief:
  red_flags:
    - "Sender is a normal mobile number."
    - "Link domain is not the courier's real domain."
    - "Small fee + deadline: a classic pressure combination."
  habit: "Check deliveries only in the app or site you open yourself."
  already_clicked: "Block your card in your banking app, call your bank on the number on your card, and report it."
  sources: [europol-scam-smishing, bsi-smishing]   # ids in content/sources.yaml (placeholders here)
