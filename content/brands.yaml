# Fictional brand registry — Scam Atlas: Europe
# Owner: ux-artist · Reviewers: sceptic-reviewer (brand-resemblance check), qa-playtester (contrast)
# Last update: 2026-11-18 (rework 1) · Status: DRAFT, awaiting sceptic re-review (T-1.6)
#
# Rules (CLAUDE.md Red Lines 1 and 3):
# - Every brand that appears in game content must be listed here. Scenario writers may not invent brands.
# - Domains: .example / .test / .invalid only (RFC 2606). Phone numbers: never full; masked or "number on
#   your card" style. IBANs: checksum-invalid, generated by content tooling, never stored here.
# - `lookalike_examples` lists sanctioned spoof domains for scam scenarios. Every look-alike must still
#   look wrong (or right) AFTER lowercasing, because real address bars lowercase hosts. Homoglyphs that
#   rely on capital letters are not allowed as hosts; use `display_text_only: true` for those.
# - Owner-part rule (UI_SPEC §4.4): the owner part of any in-game host is its last two labels
#   (`<name>.<reserved TLD>`). No multi-label suffixes (no ".co.example").
# - PALETTE SYNC: every colour used in public/brands/<id>*.svg MUST be listed in that brand's `palette`
#   below, and mirrored in src/styles/tokens.css (--brand-<id>-*). A brand may not borrow another
#   brand's colours. Proposed Vitest check: parse SVG fills/strokes and compare (UI_SPEC §14).
# - `checked_against` lists real brands the design was kept away from. Review notes only: these names
#   must never appear in game content.
#
# Collision status (BRAND_CHECK.md, fraud-researcher, 2026-11-18): web, app-store and company-directory
# search. Not trademark clearance: TMview/EUIPO refused automated access. Every entry therefore has
# `trademark_search: web-checked 2026-11-18; formal TMview/EUIPO search pending before G4`
# (classes 9, 35, 36, 38, 39, 41, 42).
#
# Rename history:
# - 2026-11-18  Lantern Network -> Waymarker Network (sceptic: "Lantern" is a VPN app and a child-safety programme)
# - 2026-11-18  PaketPilot -> Trundle (sceptic: collision not ruled out; German courier-style naming)
# - 2026-11-18  Corvelle Bank -> Larchwick Bank (BRAND_CHECK: near-homophone of CorVel Corporation, US claims/payments)
# - 2026-11-18  Hoardly -> Swaploft (BRAND_CHECK: GoHoardly, active budgeting app)
# - 2026-11-18  Nodkey -> Gatewren (BRAND_CHECK HIGH: live "Nodkey" sign-in approval add-on + iPhone app)
# Owners of GDD, template and scenarios must use the new names (GDD v3 already does).

version: 2

common:
  trademark_search: "web-checked 2026-11-18 (docs/patterns/BRAND_CHECK.md); formal TMview/EUIPO search pending before G4"

brands:
  # -------------------------------------------------------------------------------------------
  - id: waymarker
    name: "Waymarker Network"
    short_name: "Waymarker"
    sector: non-profit / player's employer
    role_in_game: >
      Fictional non-profit (not an EU body, never styled like one) that employs the player as a
      "trust inspector". Source of genuine work messages, and impersonated in chapter 0.
    sub_brands:
      - id: waymarker-desk
        name: "Waymarker Desk"
        purpose: Staff and IT portal (sign-in, travel documents, tickets). Faked in boss 0-6.
        domain: desk.waymarker-network.example
        logo: public/brands/waymarker-desk.svg
      - id: waymarker-mail
        name: "Waymarker mail"
        purpose: The player's work mailbox. Spoofed in 0-2 ("mailbox full").
        domain: mail.waymarker-network.example
    domain: waymarker-network.example
    email_addresses: ["adaeze.okafor-lind@waymarker-network.example", "it-desk@waymarker-network.example"]
    known_channels: "Staff directory inside the game (contact cards for Adaeze and the IT desk). No real numbers."
    palette:
      primary: "#22223B"       # ink
      on_primary: "#F2B24C"    # amber on ink 8.27:1
      accent: "#F2B24C"        # amber (top stone, light rays)
      secondary: "#EDE8DD"     # stone (lower stones in the mark)
      text_on_light: "#22223B" # 15.44:1 on white
    logo: { lockup: public/brands/waymarker.svg, mark: public/brands/waymarker-mark.svg }
    typography: "System UI sans, extra-bold, title case 'Waymarker' + tracked small caps 'NETWORK'."
    rationale:
      name: >
        A waymarker is the sign or cairn that keeps walkers on a trail. Ordinary English noun, not a
        typo or blend of any company name.
      colour_shape: >
        Stacked-stone cairn with the top stone lit amber, on an ink tile. No lantern, lighthouse,
        shield, padlock, eye or EU-style stars/blue.
      typography: "Generic system sans; no custom letterforms to imitate."
    checked_against: ["Lantern (VPN app)", "Lantern (child-safety programme)", "Lookout (mobile security)", "Waymark (US video ads)", "Waymarkly (waymarking app)", "WayMaker / Waymaker OS", "Waymap"]
    web_check: "Low. No product or company named 'Waymarker'; near names are in unrelated sectors (BRAND_CHECK §1)."
    lookalike_examples:
      - "waymarker-desk-login.example"
      - "desk.waymarker-network.example-sso.test"   # owner part: example-sso.test (mock-up 2)
      - "waymarker-it-support.example"
      - "waymarker-helpdesk.example"                # spoof sender domain (mock-up 2)
    trademark_search: "web-checked 2026-11-18; formal TMview/EUIPO pending before G4"
    status: draft

  # -------------------------------------------------------------------------------------------
  - id: trundle
    name: "Trundle"
    sector: parcel courier / lockers
    role_in_game: >
      Courier in Berlin and later chapters: genuine locker notifications, app tracking ("open the app
      yourself"), and the brand most impersonated in parcel-fee smishing.
    domain: trundle.example
    app_name: "Trundle app"
    sms_sender_id: "TRUNDLE"
    known_channels: "Trundle app (in-game) and the typed address trundle.example. No phone number shown."
    palette:
      primary: "#0E5E63"       # petrol teal
      on_primary: "#FFFFFF"    # 7.50:1
      accent: "#A8E6CF"        # mint, non-text on primary 5.32:1
      text_on_light: "#0E5E63"
    logo: { lockup: public/brands/trundle.svg, mark: public/brands/trundle-mark.svg }
    typography: "Rounded system sans, extra-bold, all lowercase 'trundle'."
    rationale:
      name: >
        "To trundle" is to roll along slowly on wheels: a gentle joke for a courier. Language-neutral;
        no "Paket", "Post", "Express", "Parcel" or "Logistics".
      colour_shape: >
        Petrol teal + mint, a parcel on two wheels with dashed motion lines. Couriers in Europe cluster
        on yellow, red, brown, orange, purple+orange and blue+yellow. No horn, arrow, smile-arrow, wing,
        paper plane or globe.
      typography: "Lowercase rounded sans; regional couriers mostly use bold uppercase or italic wordmarks."
    checked_against: ["DHL", "Deutsche Post", "DPD", "GLS", "Hermes/Evri", "UPS", "FedEx", "PostNL", "InPost", "bpost", "La Poste", "Correos", "PostNord", "Royal Mail", "Packeta", "Amazon logistics", "Trunkrs (NL same-day parcels)", "trundle.me (travel-content app)"]
    web_check: "Low. No courier or logistics company named Trundle; trundle.me is a travel-content app; Trunkrs only partly overlaps in sound (BRAND_CHECK §2)."
    lookalike_examples:
      - "trundle-zoll.example"          # "customs" fee page (Berlin 1-7)
      - "trundle-redelivery.example"
      - "trundle.example-tracking.test" # real name first, different owner (owner part: example-tracking.test)
      - "trunclle.example"              # "cl" for "d": survives lowercasing; difficulty 4+ only; Check shows it in mono
      - "trundie.example"               # "i" for "l": survives lowercasing
      - host: "trundIe.example"         # capital I for l
        display_text_only: true         # allowed only as text inside an image/letter/social post, never as an address-bar host
    trademark_search: "web-checked 2026-11-18; formal TMview/EUIPO pending before G4"
    status: draft

