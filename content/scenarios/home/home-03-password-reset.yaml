# 0-3 Password reset you started yourself (GDD §16). Genuine, high stakes. New mechanics: the timer
# (honest: "link valid 15 minutes") and "things you started". The first timer of the game is on a
# GENUINE message so "timer = scam" is never learned.
# Opens on the Waymarker Desk page where the player has just tapped "Forgot password", so the
# player can see they started it; the reset email follows. The in-message action is proceed.
# Difficulty 2 (GDD table says 1): the chapter uses difficulty 2 for 0-4 and the boss, and the
# difficulty-parity rule (GDD §6, balance.yaml genuine_at_every_difficulty_used) needs a genuine
# scenario at 2. Flagged for game-designer.
id: home-03-password-reset
chapter: home
role: standard
pattern: it-portal-credential-phishing
theme: password-reset
player_started: true
learning_objectives: [LO-17, LO-03]
difficulty: 2
is_fraud: false
stakes: high
device: browser
brands: [waymarker]
pressure:
  timer: true
  levers: [urgency]
  honest_deadline: "Reset link valid 15 minutes"

message:
  page: { address: "desk.waymarker-network.example/forgot-password", title: "Waymarker Desk · Reset your password" }
  body: |
    You asked to reset your Waymarker Desk password. We've sent a reset link to your work email. It works for 15 minutes. Nothing there? Check your spam folder, or start again.
  request: none

inspectables:
  - target: page.address
    reveal: "It fits: you opened desk.waymarker-network.example yourself from your bookmark, a moment ago. That isn't proof on its own, so weigh it with whether you started this."
    red_flag: false
    type: page_address
    reassures: true
  - target: page.info
    reveal: "It fits: the connection is encrypted, which is necessary. That isn't proof on its own of who runs the site, so weigh it with whether you started this."
    red_flag: false
    type: padlock

actions:
  - id: go_to_inbox
    label: "Go to your inbox"
    kind: proceed
    next_beat: reset_email
  - id: close_forgot_page
    label: "Close the page and try later"
    kind: ignore
    outcome: still_locked_out

beats:
  - id: reset_email
    device: email
    message:
      sender: { display: "Waymarker Desk", detail: "it-desk@waymarker-network.example" }
      subject: "Reset your Waymarker Desk password"
      body: |
        Someone asked to reset the password for your Waymarker Desk account a minute ago. If it was you, set a new password here (valid for 15 minutes): desk.waymarker-network.example/reset/7Q4M

        If it wasn't you, ignore this email. Your password stays the same.

        Request ID R-30418
      request: log_in
      references: ["R-30418"]
    inspectables:
      - target: sender.detail
        reveal: "It fits: it-desk@waymarker-network.example is the address Waymarker Desk always uses. That isn't proof on its own, so weigh it with whether you started this."
        red_flag: false
        type: sender
        reassures: true
      - target: link
        reveal: "It fits: the owner part is waymarker-network.example, the same site you were on a minute ago. That isn't proof on its own, so weigh it with whether you started this."
        red_flag: false
        type: link
        reassures: true
      - target: reference
        reveal: "R-30418 is a request number. It doesn't prove anything either way."
        red_flag: false
        type: reference
    actions:
      - id: use_reset_link
        label: "Use the link and set a new password"
        kind: proceed
        outcome: password_reset_done
        pressure_target: true
      - id: restart_from_desk
        label: "Reset again from Waymarker Desk yourself"
        kind: verify_in_app
        outcome: reset_from_desk
      - id: report_reset
        label: "Report the email as phishing"
        kind: report
        outcome: reset_reported
      - id: ignore_reset
        label: "Ignore the email"
        kind: ignore
        outcome: reset_ignored

outcomes:
  still_locked_out:
    narrative: "You close the page. You're still locked out of Waymarker Desk, and the travel pack has to wait."
  password_reset_done:
    narrative: "New password set. Waymarker Desk opens, and your travel pack is right where Adaeze said."
  reset_from_desk:
    narrative: "You start again from your bookmark, a fresh link arrives, and you're in. A bit slower, just as safe."
  reset_reported:
    narrative: "IT replies: \"That one was real, you asked for it a minute ago.\" The link has run out, so you start again."
  reset_ignored:
    narrative: "The link runs out after 15 minutes. You're still locked out."

debrief:
  variant: standard
  layer1:
    tell: "You asked for this reset a minute ago."
    what_works: "Use the link, or reset from Waymarker Desk."
  layer2:
    message_flags: []
    notes: "Why it was safe to act: it arrived right after you asked, and the link went to the site you were already on. The 15-minute limit was honest, and real reset links do run out quickly. The question that matters is not \"is there a deadline?\" but \"did I start this?\" An unexpected reset email is a different story: then open the site yourself."
  device_tip: "On a real phone, press and hold the link to preview it. It should go to the same site you just used."
  habit_card: calm-not-paranoid
  sources: [ie-ncsc-phishing-guide, de-bsi-protect-phishing, fr-cybermalveillance-fiche-hameconnage]
