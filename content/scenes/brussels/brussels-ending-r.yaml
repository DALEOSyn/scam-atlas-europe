# Brussels ending R (GDD §30.6, STORY §3.10 part 1; sensitive): the arc closed with "Tell me now".
# With money in (scene sees alex_invested as a flag in the finale, CR-43(d)) R plays C's damage control and
# recovery-agency test, so this scene shows C's recovery panel and Teo (warm), then the R line: 3 panels.
# Adaeze's warm panel ("…The lie was theirs, not yours.") is dropped, as in C (R25(4), learning-psychologist on
# T-3.13): the arc damage control has just opened with that line.
# With nothing in R plays Teo's chat, so it shows A's Teo lines (sheepish, then proud): 3 panels.
# Teo's R line "Sometimes you just want to know. Asking is never wrong." closes both branches: it is the panel
# every R player sees (the validator needs one shared panel), and it is true for both, since "Tell me now" was
# asking (deviation from STORY §3.10, which gives it to R without money only).
# No "you told someone" line: R players have arc_told_someone only if Teo's chat or an arc slot decided by
# asking someone set it (CR-51), and the R line says what they did in other words (R22(2)), true for every R
# player whatever the flags. No "You stepped back early…" line (that is A′ only; psych note, GDD §30.14 item 9).
# Teo's fixed line "Same picture, different name. Asking was the smart bit." is split over two panels, word for
# word, to show "sheepish, then proud" (STORY §3.10).
id: brussels-ending-r
chapter: brussels
slot: resolution
sensitive: true
if_arc_ending: [R]
panels:
  - backdrop: brussels-office
    crop: right
    speaker: teo
    expression: sheepish
    flip: true
    unless_flag: alex_invested
    line: "Same picture, different name."
    alt: "Teo with a sheepish smile by the desk with the laptop, under the high window."
  - backdrop: brussels-office
    crop: left
    speaker: teo
    expression: proud
    unless_flag: alex_invested
    line: "Asking was the smart bit."
    alt: "Teo, proud, by the stacked boxes and the noticeboard."
  - backdrop: brussels-office
    crop: left
    speaker: adaeze
    expression: calm
    if_flag: alex_invested
    line: "Stop paying, call the bank on the number on your card, and keep the chats. The Help link shows who else can help."
    alt: "Adaeze, calm, by the stacked boxes and the noticeboard."
  - backdrop: brussels-office
    crop: right
    speaker: teo
    expression: warm
    flip: true
    if_flag: alex_invested
    with: { id: adaeze, expression: calm }
    line: "I typed my card into a prize page, remember? It happens. What counts is what you do next, and you're doing it."
    alt: "Teo smiling beside a big plant under the high window; Adaeze listens, calm."
  - backdrop: brussels-office
    crop: centre
    speaker: teo
    expression: warm
    line: "Sometimes you just want to know. Asking is never wrong."
    alt: "Teo smiling at the desk by the small projector, a high window behind him."
