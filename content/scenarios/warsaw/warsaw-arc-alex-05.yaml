# Arc beat, slot 5 (GDD §10.1, §10.2; STORY §1.4: arc slot N plays by play position, so the line is
# city-agnostic). "Start small with me" on an unknown platform. Warning sign: unregistered platform.
# Friendship only; Alex's line is ≤ 25 words, generic, no persuasion copy, no platform name or link.
# Options per §10.1 slot 5: Check the regulator list → check_official_list · Sign up and add €50 → pay;
# plus "Tell Teo" (ask_someone), as in slots 2–3 (writer addition, flagged).
# Placement (GDD §25.4): between 5-4 and 5-5, never next to 5-6, so a "friend asks for money in a chat"
# debrief can't be read against the arc.
# No regulator is named (the in-world regulator is not registered yet; Dublin): "the official
# register". A fall on an arc beat gets no damage control here (GDD §10.2); alex_invested += 50.
# Sources are investment-fraud ids from sources.yaml (not in the chapter 5 sources file: the arc is cross-
# chapter); flagged for fraud-researcher.
id: warsaw-arc-alex-05
chapter: warsaw
role: arc
arc_slot: 5
learning_objectives: [LO-14, LO-13]
is_fraud: true
device: messenger
brands: [wordswap]
cast: [alex, teo]
pressure: { timer: false, levers: [] }

message:
  sender: { display: "Alex", detail: "Practice partner from Wordswap" }
  from_cast: alex
  body: |
    I've been trying a little trading app and it's going really well 📈 Start small with me? Even €50 is fine. I'll show you how!
  request: pay

inspectables:
  - target: sender.detail
    reveal: "Shows Alex, your practice partner from Wordswap, as any profile would. A profile name can't prove anything either way."
    red_flag: false
    type: sender

actions:
  - id: sign_up_add_fifty
    label: "Sign up and add €50"
    kind: pay
    outcome: added_fifty
    pressure_target: true
  - id: check_official_register
    label: "Look the app up on the official register"
    kind: check_official_list
    outcome: not_registered
  - id: tell_teo_trading
    label: "Tell Teo about it"
    kind: ask_someone
    outcome: teo_on_trading

outcomes:
  added_fifty:
    narrative: "You sign up and add €50. Within an hour your dashboard shows €61. Alex: \"Told you! 🚀\""
    arc_effects: { alex_invested: 50 }
  not_registered:
    narrative: "You ask Alex for the app's name and look it up on the financial regulator's public register. It isn't on the register of firms allowed to offer investments."
  teo_on_trading:
    narrative: "Teo: \"A friend from a language app, and now an investment app? Ask where it's registered, kiddo. And keep your €50 for now.\""

debrief:
  variant: arc
  layer1:
    tell: "A friend online steering you to an app you can't check."
    what_works: "Check the official register; tell someone you trust."
  layer2:
    message_flags: []
    notes: "Most friends who mention an app are just chatting. But an online friend steering you to put money into a platform you can't find on any official register is a common step in investment scams. A real investment firm is registered, and checking costs nothing."
  already_clicked:
    paid: "Already added money? Don't add more, whatever the dashboard shows. Call your bank on the number on your card, keep the chats, and tell a trusted adult."
  sources: [ie-garda-investment-2025, ie-fraudsmart-investment-2025, be-police-romance-2026, eu-esas-ai-scams-factsheet-nl]
