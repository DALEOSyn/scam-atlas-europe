# Andrés's worry is the deposit itself, never a bank message (the v1.3 "bank's been texting" line is cut,
# STORY §4.2 rule 2). Lucía's rule is the last serious line; Andrés's joke answers it, so the scene ends on
# a laugh, never on worried (STORY §5.3).
id: madrid-turn
chapter: madrid
slot: turn
panels:
  - backdrop: madrid-kitchen
    crop: right
    speaker: andres
    expression: worried
    flip: true
    caption: "Afternoon."
