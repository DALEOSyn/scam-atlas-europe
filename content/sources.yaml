  - id: de-breg-bsi-paket-sms-2021
    publisher: Federal Government of Germany (Bundesregierung), reporting a BSI warning
    title: "Achtung vor vermeintlichen Paket-SMS"
    url: https://www.bundesregierung.de/breg-de/service/archiv/bsi-warnung-paket-sms-1888810
