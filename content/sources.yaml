    notes: "English gloss: 'What must I do as an employer to meet the identification duty?'. Before the employee starts ('Voordat de werknemer in dienst komt'), the employer checks the ORIGINAL ID for authenticity and validity and keeps a legible copy in the payroll records (document number, photo, BSN) for 5 years after the year the employee leaves. Agency workers: the hirer checks the original but keeps a copy only for non-EEA nationals. So a genuine employer does ask for ID, at the hiring stage, as part of employment."

