    notes: "BUSINESS-ACCOUNT CAVEAT: the check compares against the legal name registered with the beneficiary's bank (trade names considered where possible); for a legal entity with a Belgian or Dutch account, the registered name is shown to the payer on a no match as well as a close match. So 'no name on a no match' holds for private persons (nl-betaalvereniging-iban-name-check), not always for companies. Close match: 'Did you mean <registered name>?'. Also: the check confirms only that name and account number correspond; contact details on a fraudulent invoice may also be fraudulent; 'you are responsible for the transfers you make'."

