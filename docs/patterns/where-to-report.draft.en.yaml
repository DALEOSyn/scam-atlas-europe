    - id: pl-cert-incident
      name: "CERT Polska incident report"
      body: "Report fake websites, such as a fake page to 'collect a payment', and other online incidents."
      url: https://incydent.cert.pl
      checked: 2026-11-19
      sources: [pl-cert-monthly-2025-12, pl-cert-monthly-2026-07, pl-nask-okazja-czy-pulapka-2025, pl-cert-vote-takeover-2026]
      review_note: "Portal loaded 2026-11-18 (title 'Zgłoś incydent | CERT.PL', JavaScript app). On 2026-11-19 the URL was re-confirmed in CERT Polska's July 2026 summary (p.4, fn 1) and NASK's 2025 guide (p.23), not reloaded. The destination runs its own first-party analytics (analytics.cert.pl); the game adds no tracking. See meta.external_links_note."
    - id: pl-police
      name: "Police (zawiadomienie)"
      body: "Report the fraud at a police station. Keep the chats, links and payment confirmations."
      checked: 2026-11-19
      sources: [pl-nask-okazja-czy-pulapka-2025, pl-uknf-seniors-payments-2025]
      review_note: "No URL or phone: no official Polish online fraud-report route was verified. NASK's guide also mentions the prosecutor's office for large losses (not shown)."

  PT:
