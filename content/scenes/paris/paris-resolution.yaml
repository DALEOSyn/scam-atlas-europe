# Paris resolution (GDD §23.13 beat 4, STORY §3.3; relieved): after the boss debrief and damage control.
# Panel 1, Friday evening: you ring Solène on the directory number (the known channel; she answers from
# home, phone-ear pose, plain wall: her kitchen has no backdrop, and a video panel would blur the boss's
# lesson that a call or video call proves nothing). The player dials, so the scene never treats an
# incoming caller as proof. Variant on paris_boss_sent (any boss fall): GDD §23.13 has two lines keyed to
# the first damage-control pick, which the story layer cannot read yet (only story-only flags), so one
# line true in both branches is used: the bank was called first thing (by you, or together), no refund
# promise. Panel 2, Tuesday: Inès with Bastien (back from leave; calm, also after a loss) adds the new
# line to the card and has shown her mum. Panel 3: Solène's If-then line (calm phone-ear pose: the
# number in our file).
id: paris-resolution
chapter: paris
slot: resolution
panels:
  - speaker: solene
    expression: relieved-phone-ear
    unless_flag: paris_boss_sent
    caption: "Friday evening. You ring Solène on the directory number."
    line: "Thanks for ringing. None of that was me, and nothing went out. I've changed my email password."
    alt: "Solène, relieved, phone to her ear."
  - speaker: solene
    expression: calm-phone-ear
    if_flag: paris_boss_sent
    caption: "Friday evening. You ring Solène on the directory number."
    line: "Thanks for ringing. None of that was me. The bank was called first thing, the right first step. We'll see what it can recall."
    alt: "Solène, calm, phone to her ear."
  - backdrop: paris-workshop
    crop: left
    speaker: ines
    expression: proud
    with: { id: bastien, expression: calm }
    caption: "Tuesday."
    line: "New line on the card: a call or video call never replaces the sign-off. I've shown my mum too."
    alt: "Inès, proud, by the procedure card in the workshop; Bastien listens, calm."
  - backdrop: paris-workshop
    crop: right
    speaker: solene
    expression: calm-phone-ear
    flip: true
    if_then:
      cue: "If a payment is new, changed, urgent or secret,"
      action: "then we call the number in our file, and two of us sign off."
      extra: "A matching name only tells you whose account it is."
    alt: "Solène, calm, phone to her ear, in the workshop."
