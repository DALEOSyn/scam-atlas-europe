    notes: "Red flags: urgency; sender address differs from earlier genuine mail; requests to click, download or give credentials. Habit: type the bank's address yourself; take caller details and call back on a number you look up; don't verify using a number the caller gives. Older campaign material."

  - id: eu-ebf-cyberscams
