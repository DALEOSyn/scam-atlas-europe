  - id: es-boe-orden-tdf-149-2025
    publisher: Ministerio para la Transformación Digital y de la Función Pública (Boletín Oficial del Estado)
    title: "Orden TDF/149/2025, de 12 de febrero (medidas contra la suplantación de identidad en llamadas y mensajes)"
    url: https://www.boe.es/boe/dias/2025/02/15/pdfs/BOE-A-2025-2870.pdf
    published: "2025-02-15"
    accessed: "2026-11-19"
    region: ES
    tier: 3
    used_for: [bank-safe-account-call, MAP-ch4]
    notes: "Legal text. Operators must block calls and SMS/MMS/RCS with an empty or unassigned Spanish number (arts. 4, 6); calls and messages from abroad presenting a Spanish number (arts. 5.1, 7.1, within 3 months) or a Spanish alias (art. 7.2); and messages whose alias is not in the CNMC alias register or not sent by a provider authorised for it (art. 8.3). Companies and administrations must register aliases before use (art. 8). Mobile ranges may not be used for customer-service or unsolicited commercial calls (art. 9); 800/900 for customer service (art. 10). Alias articles originally effective 15 months after entry into force; later postponed (see es-boe-cnmc-circular-2-2026). Banks are named only in the preamble."

