# CR-35 (ruling R14): an engage ("Move the chat to Kettle") ends boss beat 1 at ★★, because beat 2
# continues the same conversation (covered_by: [start]). Beat 1 is a marketplace buyer chat (CR-33).
id: fx-cr35-boss-off-platform
chapter: fixtures
role: boss
pattern: payment-detail-change
theme: marketplace-sale
learning_objectives: [LO-03, LO-02]
difficulty: 4
is_fraud: true
device: marketplace
brands: [swaploft, kettle]
pressure: { timer: true, levers: [helpfulness, urgency] }

message:
  app: { brand: swaploft }
  listing: { title: "Stove", price: "€40.00" }
  sender: { display: "user 3150", detail: "Swaploft buyer · user 3150" }
  body: "Hi! I'll take the stove and add €5 for a quick pick-up. I'm hardly ever on here, let's continue on Kettle: +48 5•• ••• •31"
  request: reply
  ask: { text: "let's continue on Kettle" }
  phone_numbers: ["+48 5•• ••• •31"]

inspectables:
  - target: sender.detail
    reveal: "A buyer's account inside Swaploft's own chat. Anyone can open one, so it can't prove anything either way."
    red_flag: false
  - target: reference
    reveal: "Your own listing. It's public, so it can't prove anything either way."
    red_flag: false
  - target: phone_number
    reveal: "A number for chatting. Real buyers share numbers too, so it can't prove anything either way."
    red_flag: false
  - target: request
    reveal: "Asks you to leave Swaploft's chat. Off the platform, Swaploft can't see the deal or protect it."
    red_flag: true
    type: request

actions:
  - { id: move_to_kettle, label: "Move the chat to Kettle", kind: reply, outcome: moved_chat, pressure_target: true }
  - { id: check_sales, label: "Keep it in Swaploft: check your sales", kind: check_with_platform, outcome: nothing_paid }
  - { id: report_buyer, label: "Report the buyer in Swaploft", kind: report, outcome: buyer_reported }
  - { id: ignore_buyer, label: "Ignore it", kind: ignore, outcome: ignored }

beats:
  - id: collect
    arrives_after: 45
    covered_by: [start]
    device: messenger
    message:
      sender: { display: "+48 5•• ••• •31", detail: "+48 5•• ••• •31", new_contact: true }
      body: "It's the stove buyer. I've paid already. To receive the money, collect your payment here: swaploft-safe-delivery.example/collect/3150"
      request: enter_details
      ask: { text: "To receive the money, collect your payment here" }
    inspectables:
      - target: sender.detail
        reveal: "Not in your contacts: the number the buyer gave you. It can't tell you anything either way."
        red_flag: false
      - target: link
        reveal: "swaploft-safe-delivery.example: the owner part is not swaploft.example."
        red_flag: true
      - target: request
        reveal: "A link to collect money. When you're paid, it shows inside Swaploft."
        red_flag: true
        type: request
    actions:
      - { id: enter_card, label: "Enter your card details through the link", kind: enter_details, outcome: card_typed, pressure_target: true }
      - { id: open_sales, label: "Open your Swaploft sales yourself", kind: check_with_platform, outcome: nothing_paid }
      - { id: block_report, label: "Block and report", kind: block, outcome: buyer_reported }
      - { id: ignore_collect, label: "Ignore it", kind: ignore, outcome: ignored }

outcomes:
  moved_chat: { narrative: "You move the chat to Kettle. A minute later, a Kettle message arrives." }
  nothing_paid: { narrative: "Nothing paid yet. Real offers and payments show here." }
  buyer_reported: { narrative: "Reported. Swaploft will look at the account." }
  ignored: { narrative: "You leave it." }
  card_typed:
    narrative: "'Processing your payout…' Nothing comes in."
    recovery:
      - { step: block_card_in_bank_app, category: stop }
      - { step: tell_trusted_adult, category: stop }
      - { step: keep_evidence, category: secure }
      - { step: report_to_police, category: report }
      - { step: wait_and_see, category: harmful }
      - { step: pay_recovery_service, category: harmful }

debrief:
  layer1: { tell: "Off Swaploft, then a link to collect.", what_works: "Money comes to you inside the app." }
  device_tip: "Payments to you show in the app's sales list."
  habit_card: open-it-yourself
  already_clicked:
    entered_details: "Typed card details? Block the card in your banking app now."
  sources: [eu-europol-phishing-leaflet]
