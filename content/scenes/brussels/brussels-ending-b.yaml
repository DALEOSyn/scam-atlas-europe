# Brussels ending B (GDD §30.6, STORY §3.10 part 1; sensitive; 2 panels of 3): nothing went in and the arc was
# not closed early by a report at slot up to 6. Plays after the timeline walk-through ("Adaeze's resolution
# panel after it", GDD §30.6).
# Who reaches B: (a) the arc still open on entry: the close beat, whose photo check and report both set
# arc_told_someone, so Adaeze's line word for word from STORY §3.10, "You told someone, and the timeline did
# the rest. That's the whole trick."; (b) a report at slot 7–9: the reveal only, no flag, so the truthful
# variant "You reported it, …" (R22(2): "you told someone" only with the flag).
# The first panel is shown to every B player (the validator needs one shared panel): the pattern in general
# words, put on the plan, not the player (STORY §5.2). Added wording; names no message, amount or app.
id: brussels-ending-b
chapter: brussels
slot: resolution
sensitive: true
if_arc_ending: [B]
panels:
  - backdrop: brussels-office
    crop: right
    speaker: adaeze
    expression: warm
    flip: true
    line: "Friendly, patient, and asking for a bit more each time. It's built to work on anyone."
    alt: "Adaeze smiling by the desk under the high window, a big plant beside her."
  - backdrop: brussels-office
    crop: centre
    speaker: adaeze
    expression: calm
    if_flag: arc_told_someone
    line: "You told someone, and the timeline did the rest. That's the whole trick."
    alt: "Adaeze, calm, at the desk with the laptop and the small projector."
  - backdrop: brussels-office
    crop: centre
    speaker: adaeze
    expression: calm
    unless_flag: arc_told_someone
    line: "You reported it, and the timeline did the rest. That's the whole trick."
    alt: "Adaeze, calm, at the desk with the laptop and the small projector."
