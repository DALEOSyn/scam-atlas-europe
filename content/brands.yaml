# Fictional brand registry — Scam Atlas: Europe
# Owner: ux-artist · Reviewers: sceptic-reviewer (brand-resemblance check), qa-playtester (contrast)
# Last update: 2026-11-18 (rework 1) · Status: DRAFT, awaiting sceptic re-review (T-1.6)
#
# Rules (CLAUDE.md Red Lines 1 and 3):
# - Every brand that appears in game content must be listed here. Scenario writers may not invent brands.
# - Domains: .example / .test / .invalid only (RFC 2606). Phone numbers: never full; masked or "number on
#   your card" style. IBANs: checksum-invalid, generated by content tooling, never stored here.
# - `lookalike_examples` lists sanctioned spoof domains for scam scenarios. Every look-alike must still
#   look wrong (or right) AFTER lowercasing, because real address bars lowercase hosts. Homoglyphs that
#   rely on capital letters are not allowed as hosts; use `display_text_only: true` for those.
# - Owner-part rule (UI_SPEC §4.4): the owner part of any in-game host is its last two labels
#   (`<name>.<reserved TLD>`). No multi-label suffixes (no ".co.example").
# - PALETTE SYNC: every colour used in public/brands/<id>*.svg MUST be listed in that brand's `palette`
#   below, and mirrored in src/styles/tokens.css (--brand-<id>-*). A brand may not borrow another
#   brand's colours. Proposed Vitest check: parse SVG fills/strokes and compare (UI_SPEC §14).
# - `checked_against` lists real brands the design was kept away from. Review notes only: these names
#   must never appear in game content.
#
# Collision status (BRAND_CHECK.md, fraud-researcher, 2026-11-18): web, app-store and company-directory
# search. Not trademark clearance: TMview/EUIPO refused automated access. Every entry therefore has
# `trademark_search: web-checked 2026-11-18; formal TMview/EUIPO search pending before G4`
# (classes 9, 35, 36, 38, 39, 41, 42).
#
# Rename history:
# - 2026-11-18  Lantern Network -> Waymarker Network (sceptic: "Lantern" is a VPN app and a child-safety programme)
# - 2026-11-18  PaketPilot -> Trundle (sceptic: collision not ruled out; German courier-style naming)
# - 2026-11-18  Corvelle Bank -> Larchwick Bank (BRAND_CHECK: near-homophone of CorVel Corporation, US claims/payments)
# - 2026-11-18  Hoardly -> Swaploft (BRAND_CHECK: GoHoardly, active budgeting app)
# - 2026-11-18  Nodkey -> Gatewren (BRAND_CHECK HIGH: live "Nodkey" sign-in approval add-on + iPhone app)
# Owners of GDD, template and scenarios must use the new names (GDD v3 already does).

version: 2

common:
  trademark_search: "web-checked 2026-11-18 (docs/patterns/BRAND_CHECK.md); formal TMview/EUIPO search pending before G4"

