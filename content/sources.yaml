  # ---------------------------------------------------------------- Payee-name check (VoP) and ID-copy rules (phase 3 ch2 follow-up, 2026-11-19)
  # eu-eurlex-ipr-2024-886 and eu-epc-vop-scheme are ported from the Paris branch (same ids and fields; used_for extended).
  - id: eu-eurlex-ipr-2024-886
    publisher: European Union (EUR-Lex, Official Journal)
    title: "Regulation (EU) 2024/886 of the European Parliament and of the Council of 13 March 2024 amending Regulations (EU) No 260/2012 and (EU) 2021/1230 and Directives 98/26/EC and (EU) 2015/2366 as regards instant credit transfers in euro"
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32024R0886
    published: "adopted 2024-03-13; in force 2024-04-08 (EUR-Lex metadata)"
    accessed: "2026-11-19"
    region: EU
    tier: 1
    used_for: [payment-detail-change, messenger-family-impersonation]
    notes: "Read to char 100000 of ~133000 (Art. 5c fully covered). Art. 5c (inserted into Reg. 260/2012): payer's PSP must offer payee verification 'regardless of the payment initiation channel', 'immediately after the payer provides relevant information about the payee' and before authorisation. Outcomes: match; 'almost' match (PSP shows the payee name linked to the IBAN); no match (payer told authorising 'might lead to transferring the funds to a payment account not held by the payee indicated by the payer'); check not possible. Service must not prevent the payer from authorising (5c(5)). PSPs must tell users the liability/refund consequences of ignoring a notification (5c(7)). PSP not liable for execution to an unintended payee if it complied (5c(8)); payer's PSP refunds if it failed to offer the check. 'free of charge' wording located in Art. 5b(2) in this reading (the ECB page states the VoP service is free; rely on eu-ecb-ipr for that). Application (5c(9)): euro-area PSPs by 2025-10-09; non-euro Member States by 2027-07-09. Adoption and entry-into-force dates are from EUR-Lex metadata; the OJ publication date was not checked. Amsterdam re-check 2026-11-19: Art. 5c does not say the payee name is shown on a no match (only on a close match)."

  - id: eu-epc-vop-scheme
    publisher: European Payments Council
    title: "Verification Of Payee"
    url: https://www.europeanpaymentscouncil.eu/what-we-do/other-schemes/verification-payee
    published: n/d (latest dated event 2024-10-10)
    accessed: "2026-11-19"
    region: EU
    tier: 3
    used_for: [payment-detail-change, messenger-family-impersonation]
    notes: "Scheme answers 'match', 'no match', 'close match' (with the payee's name) or 'check not possible'; the requesting PSP 'immediately passes on the response to the payer'. Rulebook published 2024-10-10, in force 2025-10-05. Limitation stated: the scheme is a messaging function, not a payment instrument, and 'cannot be relied upon to identify a private or a legal person'. Does not cite the regulation number or the 2025-10-09 date (use eu-eurlex-ipr-2024-886)."

  - id: nl-betaalvereniging-iban-name-check
    publisher: Betaalvereniging Nederland (Dutch Payments Association)
    title: "IBAN-Name Check"
    url: https://www.betaalvereniging.nl/en/?p=3093
