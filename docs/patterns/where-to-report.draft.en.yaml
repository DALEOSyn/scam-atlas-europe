# ---------------------------------------------------------------- 4b. Coverage per chapter country (T-3.8r, 2026-11-19)
# report = national cyber/fraud reporting route · advice = advice line (not a report) · police · bank
# support = emotional-support line (never a crisis line) · child = young people's line · crisis = suicide/crisis line (own final row)
# "fallback" = no country-specific entry verified; the UI shows fallbacks.<role>. No crisis fallback: "none" = no crisis row.
# Card order (WHERE_TO_REPORT.md §3c): scam help = bank, Report it (report + advice + police), support, child, crisis last;
# sensitive-scene help = support, child, crisis, then bank and Report it. `harassment` entries appear only on that help card.
#   DE  report: de-police (online, Onlinewache), de-bnetza   police: de-police   bank: de-card-block   support: de-telefonseelsorge   child: de-116111   crisis: none
#   NL  report: nl-fraudehelpdesk, nl-cmi-id-copy   police: nl-police-hulpvraagfraude, nl-police-account-takeover   bank: nl-bank   support: nl-luisterlijn (normal rate)   child: nl-kindertelefoon   crisis: none
#   FR  report: fr-17cyber, fr-cybermalveillance   advice: fr-info-escroqueries   police: fr-police   bank: fr-bank   support: fr-116006, fr-sos-amitie   child: fr-fil-sante-jeunes   crisis: fr-3114   harassment card: fr-3018
#   ES  report: es-police (INCIBE's own report page not opened)   advice: es-017   police: es-police   bank: es-bank, es-bde-complaint   support: FALLBACK   child: es-116111 (regional source)   crisis: es-024
#   PL  report: pl-8080, pl-cert-incident   police: pl-police   bank: pl-bank   support: pl-116123   child: pl-116111   crisis: none
#   IT  report: it-polizia-postale (no URL)   police: it-112   bank: it-bank   support: it-telefono-amico (NGO site only, normal call cost)   child: it-114   crisis: none
#   PT  report: pt-police (no online channel verified)   police: pt-police   bank: pt-bank   support: pt-sns24-psych (cost unknown)   child: pt-116111   crisis: pt-1411 (free/24h from consumer body)
#   IE  report: ie-garda, ie-cbi-report (unauthorised firms)   police: ie-garda, ie-garda-confidential (investment fraud only)   bank: ie-bank   support: ie-samaritans   child: ie-childline   crisis: none
