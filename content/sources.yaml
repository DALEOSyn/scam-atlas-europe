    used_for: [card-phishing-payment-failed, multichannel-support-callback, help-where-to-report-en]
    notes: "Non-EU, supporting only. Parcel-fee SMS/email -> card details on a fake page -> call from a fake bank/card fraud team (caller ID may show the real bank number) asking to read out an SMS code or approve in the banking app 'to stop' a transaction, which actually authorises the payment. Advice: never read out codes or approve on an unsolicited call; hang up and call the number on your card or official site; block the card; check parcels via the carrier directly; report losses to police."
