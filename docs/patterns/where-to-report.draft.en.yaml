# docs/patterns/where-to-report.draft.en.yaml: "Where to report / get help" screen data, English launch (EU-wide).
# Owner: fraud-researcher. Status: DRAFT, rework 1 after sceptic FAIL (T-2.5). Entries checked 2026-11-18;
# T-3.8r (2026-11-19) added the per-country verified help list (reporting route, police, bank step,
# emotional-support line, child/youth line) for DE, NL, FR, ES, PL, IT, PT, IE, SE, BE + the generic EU entry.
# ES and PL entries from T-3.6r (Madrid/Warsaw research) and T-3.8r merged 2026-11-19; one entry per id.
# T-3.10r (2026-11-19, Dublin/Stockholm): IE adds ie-garda-confidential and ie-cbi-report; SE adds se-bank.
# T-3.12r (2026-11-19, Brussels): BE updates be-police (URL, Police on Web vs station), adds be-fsma (advice) and be-crisis.
#
# LOCATION: parked under docs/ because it trips redline:lint under content/. The engineer adds a path-specific
# exemption plus a dedicated checker, then moves it back to content/help/where-to-report.en.yaml.
#
# G1 question 6 conditions (docs/DECISIONS.md, approved 2026-11-18):
#   - This is the ONE data file allowed to hold real reporting bodies' phone numbers and URLs.
#   - Every link renders with rel="noopener noreferrer", opens in a new tab, and carries NO tracking or
#     query parameters added by the game. URLs below are stored exactly as verified.
#   - Every entry carries `checked` (the date the researcher read it on the body's own site / document).
#     The UI shows it as "Checked on <date>".
#   - 116 111 / 116 006 appear only for countries verified one by one. T-3.8r: 116 111 verified for DE, ES, PL,
#     PT, SE; national child/youth lines with other numbers for NL, FR, IT, IE, BE. 116 123 verified for DE, PL, IE.
#     116 006 verified for FR only. Countries without a verified entry get the fallback lines.
#   - Real bodies appear ONLY on this screen, never as scam props (Red Line 1).
#
# Fields:
#   id           stable id
#   title/name   short heading shown to the player
#   body         one or two plain-English sentences (age 14+ reading level)          [shown]
#   phones       optional list; one number per item, exactly as published            [shown]
#                  each item: { number, label }  (label = when to use it)
#   email        optional; exactly as published                                       [shown]
#   url          optional; the official page that was read (https only)               [shown as link]
#   scope        optional; PLAYER TEXT ONLY: what the contact is for, when narrower   [shown]
#   role         T-3.8r: report | advice | police | bank | support | child | crisis | harassment
#                (lets the UI group a country's entries)                                   [not shown]
#                  report     = national cyber/fraud reporting route
#                  advice     = advice line after a scam (not a report); shown in the "Report it" group after report/police
#                  support    = emotional-support / listening line. NEVER a suicide or crisis line.
#                  child      = line for young people (card heading "Under 18? Lines for young people")
#                  crisis     = suicide/crisis line: its own calm final row, never rendered as support.
#                               Row title for every country: "Thinking about ending your life, or worried about someone?"
#                               Wording goes to the G3 human review. Verified for ES, SE, PT, FR, BE (T-3.12r) only.
#                  harassment = online harassment / sextortion line: shown ONLY on that help card, not on the scam help screen
#   Cost wording (T-3.8r round 2): write "free" only where an official or operator page says so; known normal rate:
#                "Normal call rate." (IT: "Normal call cost."); unknown: "Call costs may apply."
#   checked      date verified (YYYY-MM-DD)                                           [shown]
#   sources      ids in content/sources.yaml that back the entry ([] = safeguarding wording, no claim)  [not shown]
#   review_note  internal note for reviewers/engineer; NEVER rendered                 [not shown]
#
# Re-verify every entry at G3 and again within 30 days before G4 (PLAN risk table).

meta:
  locale: en
  checked: 2026-11-18
  link_rel: "noopener noreferrer"
  link_target: "_blank"
  intro: "Something went wrong? You're not alone, and acting fast helps. Start at the top."
  disclaimer: "This list covers only contacts we have checked on official sites. If your country isn't listed, you can report to your local police, online or in person."
  external_links_note: "These links open official websites outside the game. They have their own privacy policies; the game sends them nothing about you."
  review_note: "Linked official sites may run their own first-party analytics (e.g. incydent.cert.pl loads analytics.cert.pl). The game adds no tracking; external_links_note tells the player this."

# ---------------------------------------------------------------- 1. First steps (order matters)
first_steps:
  - id: under-18
    title: "Under 18? Tell an adult you trust first"
    body: "Tell a parent, carer, teacher or another adult you trust. Getting help early is the right move. Asking for help is never the wrong thing to do. They can call the bank or the police with you."
    checked: 2026-11-18
    sources: []
    review_note: "Safeguarding step for the 14+ audience; wording to be checked by sceptic-reviewer and qa-playtester."

  - id: not-your-fault
    title: "It's not your fault"
    body: "Scams are built to fool people. Many people never report, and every report helps stop the next attempt."
    checked: 2026-11-18
    sources: [nl-fraudehelpdesk-police-pilot]

  - id: bank-now
    title: "Money or card details involved? Call your bank now"
    body: "Use the number on your card or in your banking app, never one from the message or the caller. Ask them to block the card and to try to stop or recall the payment. Speed matters."
    checked: 2026-11-18
    sources: [fr-gendarmerie-fovi, es-incibe-smishing-bank-callback-2025, eu-esas-ai-scams-factsheet-nl, ch-ncsc-double-phishing-2026]

  - id: no-codes
    title: "Someone now asks for a code or an approval? Hang up"
    body: "Never read out a code or approve anything in your banking or messaging app for someone who contacted you. Call back on a number you find yourself."
    checked: 2026-11-18
    sources: [ch-ncsc-double-phishing-2026, pl-cert-fake-consultants, pl-cert-phishing-kb-2026]

  - id: change-password
    title: "Typed a password? Change it"
    body: "Change it on the real site or app, and everywhere you used the same password. Turn on two-step verification and log out devices you don't recognise."
    checked: 2026-11-18
    sources: [fr-cybermalveillance-fiche-hameconnage, es-incibe-mailbox-full-2022, pl-cert-phishing-kb-2026, de-vzn-ghost-pairing-2026]

  - id: disconnect
    title: "Installed an app or let someone control your screen? Stop using the device"
    body: "Stop using it and take it offline (for example, switch on airplane mode). Don't use it for banking until someone you trust has checked it."
    checked: 2026-11-18
    sources: [ch-ncsc-parcel-calls-2022, eu-esas-ai-scams-factsheet-nl, de-vz-paketdienst-sms]

  - id: evidence
    title: "Keep the evidence"
    body: "Take screenshots of messages, sender numbers and addresses, links, times and payment references. Don't delete the chat yet."
    checked: 2026-11-18
    sources: [fr-cybermalveillance-fiche-hameconnage, es-incibe-smishing-bank-callback-2025]

  - id: report-platform
    title: "Report it in the app or site where it happened"
    body: "Use the report button of the messenger, social network, marketplace or mail app. Many mail apps have a 'report phishing' option."
    checked: 2026-11-18
    sources: [ie-ncsc-phishing-guide, be-police-romance-2026, eu-europol-mule-flyer-ie]

  - id: report-police
    title: "Report it to the police"
    body: "Many countries have online police reporting; otherwise go to a local station. Keep a copy of your report for your bank."
    checked: 2026-11-18
    sources: [eu-europol-report-cybercrime, es-incibe-smishing-bank-callback-2025]

  - id: warn-contacts
    title: "Warn the people around you"
    body: "If your messenger or social account was taken over, tell your contacts another way not to send money or codes."
    checked: 2026-11-18
    sources: [nl-politie-whatsapp-takeover-2024, de-vzn-ghost-pairing-2026, pl-nask-metoda-na-2020]

  - id: recovery-warning
    title: "Beware of 'we'll get your money back' offers"
    body: "Anyone who contacts you offering to get your money back for a fee is almost certainly running a second scam."
    checked: 2026-11-18
    sources: [ie-bpfi-recovery-2024, eu-esas-ai-scams-factsheet-nl]

# ---------------------------------------------------------------- 2. Fallbacks (shown when no verified country entry exists)
fallbacks:
  child_helpline:
    body: "Want to talk to someone? Ask an adult you trust to help you find your country's free child and youth helpline. In many EU countries it is a free 116 number."
    checked: 2026-11-18
    sources: [eu-youreurope-116]
    review_note: "Deliberately gives no number. Shown only for countries with no verified child entry (T-3.8r: all ten chapter countries now have one). Your Europe says the 116 numbers work 'in most EU countries (though coverage is not yet EU-wide)'."
  police:
    body: "Your country isn't listed yet. Contact your local police, online or in person."
    checked: 2026-11-18
    sources: [eu-europol-report-cybercrime]
  bank:
    body: "Call your bank now on the number on your card or in its app. Ask it to block the card or app and to try to stop the payment."
    checked: 2026-11-19
    sources: [eu-esas-ai-scams-factsheet-nl, eu-esas-ai-scams-factsheet-it]
    review_note: "T-3.8r. The ESAs factsheet (all EU languages) says to inform the bank at once through official channels. Used for any country without a country-specific bank source (T-3.10r: none of the ten chapter countries now; SE got se-bank) and for the generic EU/home entry."
  support:
    body: "Feeling shaken, ashamed or alone after a scam? That's a normal reaction. Talk to someone you trust, or ask them to help you find a listening line in your country."
    checked: 2026-11-19
    sources: []
    review_note: "T-3.8r safeguarding wording, no claim and no number (116 123 is not EU-wide: verified here for DE, PL, IE only; Your Europe does not list it). Round 2: 'free' removed (not verifiable EU-wide). Used today for ES (no general listening line verified; 024 is crisis only). There is no crisis fallback: crisis rows exist only where verified (ES, SE, PT, FR)."

# ---------------------------------------------------------------- 3. EU-wide
eu:
  - id: europol-report-signpost
    name: "Europol: Report cybercrime online"
    body: "Europol does not take reports itself. Its page sends you to your country's official online reporting site."
    url: https://www.europol.europa.eu/report-a-crime/report-cybercrime-online
    checked: 2026-11-19
    sources: [eu-europol-report-cybercrime]

  - id: ecc-net
    name: "European Consumer Centres Network (ECC-Net)"
    body: "Free advice if you bought something from a trader in another EU country, Norway or Iceland and it went wrong. It is not the police."
    url: https://www.eccnet.eu/node/33
    checked: 2026-11-19
    sources: [eu-eccnet-about]

# ---------------------------------------------------------------- 4. Countries (verified entries only)
# A country missing here means "not verified yet", not "no service exists". UI falls back to `fallbacks`.
countries:
  BE:
    - id: be-safeonweb-forward
      role: report
      name: "Safeonweb"
      body: "Forward suspicious messages so the links can be checked."
      email: suspicious@safeonweb.be
      checked: 2026-11-19
      sources: [be-ccb-safeonweb-2025]
    - id: be-card-stop
      role: bank
      name: "Card Stop / Fraudstop"
      body: "Shared card or banking details, or money leaving your account? Call this number at any time. It can block your cards and, via your bank, your banking apps."
      phones:
        - number: "078 170 170"
          label: "24/7: block cards and banking apps. Call costs may apply."
      checked: 2026-11-19
      sources: [be-febelfin-fraudstop-2026, be-brussels-hulpdiensten, be-safeonweb-qr-chargers, be-police-romance-2026]
      review_note: "T-3.8r: since 2026-06-22 the same number is also 'Fraudstop' (Febelfin). Cost not stated. One local police page (zone 5329) still lists the OLD Card Stop number 070 344 344: never show it."
    - id: be-police
      role: police
      name: "Police"
      body: "File a complaint after a fraud. A local police station is best, so first steps can be taken quickly; with a Belgian identity card you can also use Police on Web for some non-urgent facts. Bring screenshots and the numbers or accounts used. Under 18? Go with a parent, carer or another adult you trust."
      url: https://www.police.be/5998/fr/a-propos/campagnes-de-communication/campagne-scam/porter-plainte-pour-une-arnaque-en-ligne
      checked: 2026-11-19
      sources: [be-police-plainte-arnaque-en-ligne, be-police-romance-2026]
      review_note: "T-3.12r: police.be SCAM campaign page (French; no English version opened) says Police on Web needs a Belgian identity card and covers 'certains faits non urgents'; a local station is 'préférable'. Not checked: whether under-18s can use Police on Web. Round 2 (sceptic): the under-18 line is now in the displayed body (safeguarding wording, no source)."
    - id: be-fsma
      role: advice
      name: "FSMA (financial regulator) warnings list"
      body: "Offered an investment, or someone offering to get your lost money back? Check the firm here. The list isn't complete, so not being on it doesn't prove a firm is safe. Never pay a fee to get money back."
      url: https://www.fsma.be/en/warnings-list-companies-operating-unlawfully-belgium
      checked: 2026-11-19
      sources: [be-fsma-warnings-list, be-fsma-recovery-room, be-fsma-trading-platforms-2025]
      review_note: "T-3.12r (Brussels ending C). The page says the list 'cannot be considered as exhaustive' and points to the FSMA consumer contact form (form URL not opened on its own; not shown). FSMA recovery-room page: such firms always ask for a fee first; supervisors never contact victims for this."
    - id: be-listening-line
      role: support
      name: "Tele-Onthaal (Dutch) / Télé-Accueil (French)"
      body: "Someone to talk to, anonymously."
      phones:
        - number: "106"
          label: "Tele-Onthaal (Dutch). Call costs may apply."
        - number: "107"
          label: "Télé-Accueil (French): free, 24/7"
      checked: 2026-11-19
      sources: [be-police-autres-numeros, be-brussels-hulpdiensten]
      review_note: "107 free, anonymous, 24/7 per police.be (zone 5329). 106 from the Brussels Region portal, which gives no cost or hours; not verified on the operator's site, hence 'Call costs may apply.'"
    - id: be-youth-line
      role: child
      name: "Awel (Dutch) / Écoute-Enfants (French)"
      body: "Listening lines for children and young people."
      phones:
        - number: "102"
          label: "Awel (Dutch): free, 16:00-22:00, not on Sundays or public holidays"
        - number: "103"
          label: "Écoute-Enfants (French): free, 10:00-24:00"
      checked: 2026-11-19
      sources: [be-police-ecoute-enfants, be-brussels-hulpdiensten, be-vlaanderen-awel]
      review_note: "103 free, anonymous, daily 10:00-24:00 per police.be (zone 5300). Round 2: 102 free, anonymous, phone daily 16:00-22:00 except Sundays and public holidays per the Flemish government page (vlaanderen.be, undated, opened 2026-11-19). No 116 111 in BE found."
    - id: be-crisis
      role: crisis
      name: "Thinking about ending your life, or worried about someone?"
      body: "1813 (Dutch) and 0800 32 123 (French) are free, day and night. In danger now? Call 112."
      phones:
        - number: "1813"
          label: "Zelfmoordlijn (Dutch): free, anonymous, day and night"
        - number: "0800 32 123"
          label: "Suicide prevention line (French): free, day and night"
      checked: 2026-11-19
      sources: [be-zelfmoord1813, be-police-autres-numeros, be-brussels-hulpdiensten]
      review_note: "T-3.12r. 1813: operator site (zelfmoord1813.be) says anonymous, free, phone 24/7; also on the Brussels Region portal. 0800 32 123: police.be (zone 5329) says suicide prevention line, free, 24/7; the French-language operator's own site was NOT opened, so its name is not shown. Crisis wording goes to the G3 human review."

