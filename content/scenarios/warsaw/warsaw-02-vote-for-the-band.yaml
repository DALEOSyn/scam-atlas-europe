# 5-2 Ola's real Brewnook account: "vote for my little sister's band" (GDD §25.4 5-2; callback
# of the account-takeover code pattern, with the CERT vote-takeover advisory).
# Fraud, difficulty 3, calm (no timer, no pusher). Levers helpfulness, affection, small_amount.
# Ola is a saved contact only (never cast, never drawn). How her account was taken over is never shown.
# Checkables on the message (4; R 2): sender neutral (W2: saved contact on a log-in request), request
# neutral (an ordinary favour, as Paris 3-5), claim R (a vote that needs the code), link R (votelark).
# vote_page and code_page are training pages (no network, read-only demo fields). Their flags count toward
# spotting, not R. Writer note (BRAND_CHECK MW3): real institutions do run online votes, so the tell stays
# on the code banner ("registers your Brewnook account on a new device"); nothing here says online votes are
# fake. Fall: the code is typed (enter_details). Damage control per §25.4 (6, 2 harmful).
id: warsaw-02-vote-for-the-band
chapter: warsaw
role: standard
pattern: messenger-account-takeover-code
theme: friend
learning_objectives: [LO-05, LO-02, LO-07]
difficulty: 3
is_fraud: true
device: messenger
brands: [brewnook, votelark]
cast: []
pressure:
  timer: false
  levers: [helpfulness, affection, small_amount]

message:
  sender: { display: "Ola (volunteers)", detail: "Saved contact: Ola (volunteers)" }
  earlier:
    - { when: "Last week", body: "Welcome to Warsaw! See you at Saturday's stall 🙂" }
  body: "Hi! Could you vote for my little sister's band in the city school contest? 🙏 You just log in with your phone number and type the code you get. votelark-vote.example/band/brzoza"
  request: log_in
  ask: { text: "Could you vote for my little sister's band in the city school contest?" }
  claims:
    - text: "You just log in with your phone number and type the code you get."

inspectables:
  - target: sender.detail
    reveal: "Shows Ola's saved contact, in your usual chat, as a real message from her would. An account can be taken over and show the same contact, so it can't prove anything either way. Judge the request."
    red_flag: false
    type: sender
  - target: link
    reveal: "votelark-vote.example: a voting site you don't know, asking you to log in with your number."
    red_flag: true
    type: link
  - target: claim
    reveal: "A vote that needs the code sent to your phone. That code is a key to your Brewnook account, not a vote."
    red_flag: true
    type: claim
  - target: request
    reveal: "Asks you to vote for a band. Friends ask favours like this, so it can't prove anything either way. Look at what voting needs."
    red_flag: false
    type: request

actions:
  - id: open_vote_link
    label: "Open the link and vote"
    kind: open_link
    next_beat: vote_page
    pressure_target: true
  - id: call_ola_saved
    label: "Call Ola's saved number (a normal call)"
    kind: call_back_known
    outcome: ola_says_no
  - id: report_ola_chat
    label: "Report the chat"
    kind: report
    outcome: ola_chat_reported
  - id: ignore_ola_chat
    label: "Ignore it"
    kind: ignore
    outcome: ola_chat_ignored

beats:
  - id: vote_page
    device: browser
    message:
      page: { address: "votelark-vote.example/band/brzoza", title: "Votelark · Vote now" }
      body: "City school band contest. Vote now: enter your phone number to log in. Phone number: +48 5•• ••• •••"
      request: enter_details
      ask: { text: "enter your phone number to log in" }
    inspectables:
      - target: page.address
        reveal: "votelark-vote.example: a site you've never used, asking for your phone number to log in."
        red_flag: true
        type: page_address
      - target: page.info
        reveal: "The connection is encrypted, the same lock a real site shows. Necessary, but it can't show who runs the site, so it can't prove anything either way."
        red_flag: false
        type: padlock
      - target: request
        reveal: "Asks for your phone number to log in to a vote. Next comes a code sent to that number: read what it says it's for."
        red_flag: true
        type: request
    actions:
      - id: enter_vote_number
        label: "Enter your number"
        kind: open_link
        next_beat: code_page
        pressure_target: true
      - id: close_vote_page
        label: "Close it"
        kind: ignore
        outcome: vote_page_closed

  - id: code_page
    device: browser
    banner:
      device: sms
      message:
        sender: { display: "Brewnook", detail: "Brewnook" }
        body: "Brewnook code: 3•••••. Don't share it. This code registers your Brewnook account on a new device."
        request: none
    message:
      page: { address: "votelark-vote.example/band/brzoza/confirm", title: "Votelark · Confirm your vote" }
      body: "Almost there! Enter the 6-digit code to confirm your vote."
      request: enter_details
      ask: { text: "Enter the 6-digit code to confirm your vote." }
    inspectables:
      - target: page.address
        reveal: "Still votelark-vote.example, now asking for the code Brewnook just sent you."
        red_flag: true
        type: page_address
      - target: page.info
        reveal: "The connection is encrypted, the same lock a real site shows. Necessary, but it can't show who runs the site, so it can't prove anything either way."
        red_flag: false
        type: padlock
      - target: request
        reveal: "Asks for the code the banner says registers your Brewnook account on a new device. Typing it here hands your account to whoever runs this page."
        red_flag: true
        type: request
    actions:
      - id: type_vote_code
        label: "Type the code to vote"
        kind: enter_details
        outcome: brewnook_taken_over
        pressure_target: true
      - id: close_call_ola
        label: "Close it and call Ola"
        kind: call_back_known
        outcome: ola_says_no
      - id: close_code_page
        label: "Close it"
        kind: ignore
        outcome: code_page_closed

outcomes:
  brewnook_taken_over:
    narrative: "\"Thanks for voting!\" A minute later Brewnook logs you out on your phone. Your contacts start getting \"vote for my sister's band\" from you."
    recovery:
      - { step: log_out_unknown_devices, category: stop }
      - { step: reregister_app_own_number, category: stop }
      - { step: turn_on_two_step, category: secure }
      - { step: warn_contacts, category: warn }
      - { step: reply_to_sender, category: harmful }
      - { step: keep_quiet, category: harmful }
  ola_says_no:
    narrative: "Ola picks up: \"Vote? My sister's eleven and plays the recorder. Someone's in my Brewnook, I think. Thanks for ringing!\""
  ola_chat_reported:
    narrative: "Reported. Brewnook will look at the account. Ola still doesn't know: a normal call to her saved number would tell her."
  ola_chat_ignored:
    narrative: "You leave it. Later Ola posts on the volunteers' noticeboard: \"Don't vote for anything from me, my Brewnook was taken over!\""
  vote_page_closed:
    narrative: "You close the page without typing anything. Nothing happens."
  code_page_closed:
    narrative: "You close the page without typing the code. Your Brewnook account stays on your phone only."

debrief:
  variant: standard
  layer1:
    tell: "A vote that needs the code from your phone."
    what_works: "Never type that code anywhere. Call your friend."
  layer2:
    message_flags:
      - "The code text says what it is for: it registers your Brewnook account on a new device. A vote has nothing to do with that."
    notes: "This is one way friends' accounts get taken over: the code that registers your account goes to someone else. Then your account asks your friends. Turn on Brewnook's two-step PIN: it makes a stolen code much less useful."
  device_tip: "In your real messaging app, Settings › Linked devices lists every device signed in to your account; turn on the two-step PIN there too."
  habit_card: codes-are-only-for-you
  already_clicked:
    clicked: "Opened the page but typed nothing? Close it. Then call your friend on their saved number, a normal call, to tell them."
    entered_details: "Typed the code? Open Brewnook's linked devices and log out any you don't know, set the app up again with your own number, turn on two-step, and warn your contacts another way."
  sources: [pl-cert-vote-takeover-2026, pl-cert-monthly-2026-07, de-vzn-ghost-pairing-2026, pl-cert-phishing-kb-2026, nl-politie-whatsapp-takeover-2024]
