# Test fixture (CR-43(d)): endings A and A-prime, and R without money in; one panel for R only. R28 (mirrors
# content/scenes/brussels/brussels-ending-a*.yaml): "you helped him" is gated on arc_helped_teo (Teo's photo check or
# report); otherwise A's early report, or A-prime's "You stepped back early…".
id: fx-finale-ending-a
chapter: fxfinale
slot: resolution
if_arc_ending: [A, A_prime, R]
unless_flag: alex_invested
panels:
  - speaker: teo
    expression: proud
    line: "Same picture, different name. Asking was the smart bit."
    alt: "Teo, proud, holding up his phone."
  - speaker: teo
    expression: warm
    if_arc_ending: [R]
    line: "Sometimes you just want to know. Asking is never wrong."
    alt: "Teo smiling, putting his phone away."
  - speaker: adaeze
    expression: calm
    if_flag: arc_helped_teo
    line: "Teo asked you, and you helped him. That's what works."
    alt: "Adaeze, calm, nodding."
  - speaker: adaeze
    expression: calm
    unless_flag: arc_helped_teo
    if_arc_ending: [A]
    line: "And you reported yours early. That's what works."
    alt: "Adaeze, calm, nodding."
  - speaker: adaeze
    expression: calm
    unless_flag: arc_helped_teo
    if_arc_ending: [A_prime]
    line: "You stepped back early, and you never sent any money. Next time, telling someone too makes it even easier."
    alt: "Adaeze, calm, nodding."
