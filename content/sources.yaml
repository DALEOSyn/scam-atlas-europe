    notes: "Central bank's consumer portal. SMS spoofing replaces the sender number with an alphanumeric name that looks like the bank, so a fake SMS can appear in the same thread as genuine bank messages. Caller-ID spoofing makes a call appear to come from another number; attacks aim at banks' customer-service numbers. The bank will never ask for passwords or full keys; a caller may say a fraudulent operation happened and ask for a temporary code to cancel it: a code makes no sense if you made no operation, and the bank needs no code to cancel a fraud. Advice: check your account yourself; if something doesn't add up, hang up and call the bank on its official number. Does not mention 'safe account' transfers."

