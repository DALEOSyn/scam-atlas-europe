  # -------------------------------------------------------------------------------------------
  - id: gatewren
    name: "Gatewren"
    sector: sign-in / e-ID approval app
    role_in_game: >
      The `auth` device: push approvals, number matching, e-ID signature prompts and QR-login prompts
      (Stockholm, LO-09). Genuine prompts the player started vs. prompts triggered by someone else.
    domain: gatewren.example
    palette:
      primary: "#4B2A5C"       # plum
      on_primary: "#FFFFFF"    # 11.77:1
      accent: "#F6C8A8"        # peach, 7.70:1 on primary
      text_on_light: "#4B2A5C"
    logo: { lockup: public/brands/gatewren.svg, mark: public/brands/gatewren-mark.svg }
    typography: "System monospace, bold title case 'Gatewren'."
    rationale:
      name: >
        A gate (you decide who comes in) watched by a wren (small, alert bird). Coined compound. No
        "-key", "ID" or "eID" in the name (avoids Nodkey, Nitrokey, YubiKey, BankID, MitID, DigiD).
      colour_shape: >
        A picket gate with a small wren perched on its arch, peach on plum. No 'iD' letter pairing, flag,
        fingerprint, key, padlock or national colours. The bird is a round wren in peach, not a blue
        flying bird.
      typography: "Monospace title case, unlike the sans/stencil wordmarks of real e-ID apps."
    checked_against: ["Nodkey (KH Labs sign-in add-on + iPhone app)", "Nitrokey", "YubiKey", "BankID (SE/NO)", "MitID", "itsme", "DigiD", "Smart-ID", "Mobile-ID", "Freja eID", "FranceConnect", "SPID", "CIE", "AusweisApp", "ID Austria", "Cl@ve", "Microsoft Authenticator", "Google Authenticator", "Okta Verify", "Duo", "Seal / SealSuite"]
    web_check: "Low. No hits for 'Gatewren' (BRAND_CHECK §7, alternatives). Replaces Nodkey (HIGH: live same-function product)."
    lookalike_examples: []   # attacks in this device abuse genuine prompts; no spoof domain needed
    trademark_search: "web-checked 2026-11-18; formal TMview/EUIPO pending before G4"
    status: draft

