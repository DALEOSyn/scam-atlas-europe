    notes: "Covers impersonation incl. voice cloning/deepfakes of relatives and banks; celebrity investment ads; dating-to-investment; phishing inserted into existing email threads; marketplace deals moving the victim off-platform to a fake bank login. Advice: pause; verify via known numbers; family safe word; check regulator warning lists (IOSCO I-SCAN); never install remote-access software; contact the bank at once; beware 'recovery' offers. Notes AI removes grammar errors, so polish is not proof."

  - id: eu-epc-threats-2025
    publisher: European Payments Council
    title: "2025 Payments Threats and Fraud Trends Report (EPC162-24 v2.0)"
    url: https://www.europeanpaymentscouncil.eu/sites/default/files/kb/file/2025-12/EPC162-24%20v2.0%202025%20Payments%20Threats%20and%20Fraud%20Trends%20Report_0.pdf
    published: 2025-11-19
    accessed: 2026-11-18
    region: EU
    tier: 3
    used_for: [email-phishing-credential, messenger-account-takeover-code, it-portal-credential-phishing, multichannel-support-callback, messenger-family-impersonation, task-job-scam, MAP-ch2, MAP-ch4, MAP-ch6, MAP-ch7, MAP-ch9, MAP-ch10, MAP-missing, campaign-catalogue, ceo-fraud-bec, payment-detail-change, spoofed-authority-call, cloned-voice-family-emergency, qr-sticker-parking, bank-safe-account-call, hijacked-friend-payment-code]
    notes: "Social engineering increasingly targets people rather than technology. Covers: spoofed sender names/numbers; messages that give a phone number instead of a link; 'safe account' scams; call-then-home-visit; fake remote support; task scams with small early payouts; recovery scams; cloned voices in family-emergency scams; QR swaps on letters, invoices and EV chargers; victims asked to approve login QR codes sent via messaging apps; money mules. Read to char 100000 of ~130000. Re-read 2026-11-19 (Paris briefs), full text incl. chars 100000-130011: targets shifting to 'company executives, employees (through CEO fraud)' (p.6); AI produces 'voice and video impersonating well-known persons (e.g. CEO fraud)' (p.6) and deepfakes 'impersonate executives' (p.22); 'a particular increase in business email compromise' (p.22); invoicing exposed to 'APP fraud or IBAN manipulation' incl. QR tampering on invoices (p.7, p.17); fraudsters instruct victims 'to ignore or dismiss alerts' (p.23, bank alerts in general, not VOP specifically). VOP mentioned only as a new scheme with no fraud cases yet (p.8). No passage on VOP limits or on matching-name accounts."

