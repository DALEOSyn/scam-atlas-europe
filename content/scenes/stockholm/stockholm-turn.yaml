# Stockholm turn (GDD §29.2 beat 2, STORY §3.9; laughing → thinking; 4 panels): the stop point, after 9-3.
# Drill 9-4 (Jamal's "police" call; he asks you and hangs up in every branch) follows directly.
# Birgitta's rule ("rudeness is free", SK5) is a general habit, never wrong on the genuine twins later in the
# chapter (9-7 is started by the player, no caller): STORY §4.2 rule 2. It never mocks politeness: "Be polite
