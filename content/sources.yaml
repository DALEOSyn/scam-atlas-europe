  - id: eu-europol-phishing-leaflet
    publisher: Europol (EC3) with European Banking Federation, #CyberScams campaign
    title: "Phishing / Vishing / Smishing (campaign leaflet)"
    url: https://www.europol.europa.eu/sites/default/files/documents/3_phishing_vishing_sms.pdf
