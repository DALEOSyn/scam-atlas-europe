name: Deploy to GitHub Pages

# Manual only (T-4.9). Nothing deploys until docs/DECISIONS.md G4 records all three conditions as met and
# confirmed by Roman (the `gate` job), and Roman has enabled Pages (Settings → Pages → Source: GitHub Actions).
# The gate only stops early or accidental runs; the real control is Roman as required reviewer on the github-pages
# environment, so the `deploy` job waits for his approval. Runs from main only; rollback = revert on main, redeploy.
# Release steps: docs/RELEASE.md.
on:
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned by full commit SHA (release tag in the comment); keep in step with ci.yml.

jobs:
  gate:
    name: G4 gate (DECISIONS.md conditions 1–3 met)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # main only. A rollback is a revert on main through a reviewed PR, then a redeploy of main (docs/RELEASE.md step 10).
      - name: Deploy only from main
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Deploys run only from main (got ${GITHUB_REF})."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Node built-ins only (Node 22 type stripping), so the gate runs before any dependency is installed.
      - run: node scripts/g4-gate.ts docs/DECISIONS.md

  build:
    name: checks, subpath build, bundle budgets
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The same checks as ci.yml's `checks` job; its root build is replaced by the Pages-subpath build below.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run content:validate
      - run: npm run redline:lint
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /scam-atlas-europe/
      - run: npm run test:bundle
        env:
          VITE_BASE: /scam-atlas-europe/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  e2e:
    name: e2e (Playwright + axe), root and Pages subpath
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The same suite as ci.yml's `e2e` job.
      - run: npm run e2e
      # The smoke and base-path specs again under /scam-atlas-europe/ (manifest, SW scope, icons, deep links, 404.html).
      - run: npx playwright test --trace off tests/e2e/smoke.spec.ts tests/e2e/base-path.spec.ts
        env:
          PW_BASE_PATH: /scam-atlas-europe/
          PW_PORT: 4273

  deploy:
    name: deploy to GitHub Pages
    needs: [build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
