    notes: "FOVI: persuasion, threats or pressure to obtain an unplanned transfer, often presented as from a senior executive ('arnaque au Président'), 'urgent et confidentiel'. Variants: fake supplier announcing a 'changement de RIB'; fake employee asking to change the account their salary is paid into. By phone and/or electronic messages; sometimes follows the hacking and use of the impersonated person's mailbox. Beneficiary account often abroad. Prevention: a 'non dérogeable' internal hierarchical verification and validation procedure for unplanned transfers and bank-detail changes; clear rules to authenticate senders; limit public info on staff who can pay. Victim: identify transfers, suspend pending ones, alert bank at once and request return of funds (bank may ask for a complaint), keep evidence, change passwords if a mailbox was hacked, file a complaint with police or gendarmerie in parallel. No phone numbers given."

