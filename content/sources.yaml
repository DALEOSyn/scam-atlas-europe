  - id: eu-eba-ecb-fraud-2025
    publisher: European Banking Authority and European Central Bank
    title: "Joint EBA-ECB report on payment fraud: strong authentication remains effective but fraudsters are adapting (press release)"
    url: https://www.eba.europa.eu/publications-and-media/press-releases/joint-eba-ecb-report-payment-fraud-strong-authentication-remains-effective-fraudsters-are-adapting
