# 1-8 Look-alike "Thimble & Pine" payment-failed email with a padlocked login page (GDD §17).
# Fraud, difficulty 3, timer 60. Fraud twin of berlin-06-payment-failed: same look, same 48-hour
# deadline, same logo. Brief: card-phishing-payment-failed §2–§3 (red flags 1, 2, 3, 6), §5.
# Red flags (R): sender and link (thimbleandpine-outlet.example, registered look-alike).
# Decoys: order number and logo (reveals word-for-word as in 1-6), and the padlock on the sign-in page.
# The follow-up page address is also a red flag, not counted in R.
# LO-01 line "A logo or familiar name proves nothing" (GDD §5) is in layer 2.
id: berlin-08-payment-failed-lookalike
chapter: berlin
role: standard
pattern: card-phishing-payment-failed
theme: shop-payment
twin_of: berlin-06-payment-failed
learning_objectives: [LO-02, LO-03, LO-05]
difficulty: 3
is_fraud: true
device: email
brands: [thimble-pine]
cast: []
pressure:
  timer: true
  levers: [urgency, fear]

message:
  sender: { display: "Thimble & Pine", detail: "orders@thimbleandpine-outlet.example" }
  subject: "Payment failed for order TP-51907"
  body: |
    Hello,

    We couldn't take payment for your order TP-51907. The card on your account may have expired.

    Please update your payment method in your account within 48 hours, or we'll cancel the order: thimbleandpine-outlet.example/account/orders/TP-51907

    Thimble & Pine customer care
  request: log_in
  references: ["TP-51907"]
  image: { alt: "Thimble & Pine logo" }

inspectables:
  - target: sender.detail
    reveal: "orders@thimbleandpine-outlet.example. The owner part is thimbleandpine-outlet.example. Thimble & Pine's own domain is thimbleandpine.example."
    red_flag: true
    type: sender
  - target: link
    reveal: "thimbleandpine-outlet.example/account/orders/TP-51907. The owner part is thimbleandpine-outlet.example, not thimbleandpine.example. One extra word makes a different owner."
    red_flag: true
    type: link
  - target: reference
    reveal: "An order number in Thimble & Pine's format. Real and look-alike emails both carry them; your account at thimbleandpine.example shows your real orders."
    red_flag: false
    type: reference
  - target: image
    reveal: "The Thimble & Pine logo. Logos are easy to copy, so it proves nothing either way."
    red_flag: false
    type: logo

actions:
  - id: tap_update_card
    label: "Update your card through the link"
    kind: open_link
    next_beat: sign_in_page
    pressure_target: true
  - id: open_shop_check
    label: "Open Thimble & Pine yourself and check"
    kind: verify_in_app
    outcome: no_notice_in_account
  - id: report_lookalike_email
    label: "Report it as phishing"
    kind: report
    outcome: lookalike_email_reported
  - id: ignore_lookalike_email
    label: "Ignore it"
    kind: ignore
    outcome: lookalike_email_ignored

beats:
  - id: sign_in_page
    device: browser
    message:
      page: { address: "thimbleandpine-outlet.example/login", title: "Thimble & Pine · Sign in" }
      body: "Sign in to update your payment method. Then enter your card number, expiry date and security code."
      request: log_in
    inspectables:
      - target: page.address
        reveal: "The address bar still says thimbleandpine-outlet.example. Thimble & Pine's site is thimbleandpine.example."
        red_flag: true
        type: page_address
      - target: page.info
        reveal: "The connection is encrypted. Necessary, but never proof of who runs the site."
        red_flag: false
        type: padlock
    actions:
      - id: sign_in_enter_card
        label: "Sign in and enter your card details"
        kind: enter_details
        outcome: account_and_card_stolen
        pressure_target: true
      - id: close_sign_in_page
        label: "Close the page"
        kind: ignore
        outcome: left_sign_in_page

outcomes:
  account_and_card_stolen:
    narrative: "\"Thank you, your order is on its way!\" Next morning: a €212 card payment to a shop you've never heard of, and an email saying your Thimble & Pine password was changed."
    recovery:
      - { step: block_card_in_bank_app, category: stop }
      - { step: call_bank_known_number, category: secure }
      - { step: change_password, category: secure }
      - { step: report_to_police_online, category: report }
      - { step: reply_ask_money_back, category: harmful }
      - { step: wait_and_see, category: harmful }
  no_notice_in_account:
    narrative: "You open thimbleandpine.example yourself. Your account shows no order TP-51907 and no payment notice."
  lookalike_email_reported:
    narrative: "Reported. Your mail app moves it to junk and warns other users about the sender."
  lookalike_email_ignored:
    narrative: "Forty-eight hours pass. Nothing is cancelled, because there was nothing to cancel."
  left_sign_in_page:
    narrative: "You close the page without typing anything. Nothing happens."

debrief:
  variant: standard
  layer1:
    tell: "The link and sender were thimbleandpine-outlet.example, not the shop's own."
    what_works: "Open Thimble & Pine yourself and check."
  layer2:
    message_flags:
      - "The same 48-hour deadline a real shop might use. Deadlines appear on genuine emails too, so the addresses were the tell, not the deadline."
      - "It names an order number but no item or price, and the order isn't in your account."
      - "A sign-in page from an email link that then asks for your full card number, expiry and security code."
    notes: "A logo or familiar name proves nothing. Scammers copy them perfectly, even into a real thread. The padlock on the sign-in page only means the connection is encrypted, not who runs the site."
  device_tip: "On a real phone, press and hold the button or link to preview the address. Read the part just before the ending: one extra word means a different owner."
  habit_card: read-the-link
  already_clicked:
    clicked: "Close the page and type nothing. Delete the email or report it as phishing."
    entered_details: "Block your card in your banking app, call your bank on the number on your card, and change your Thimble & Pine password from the real site, plus anywhere you reused it."
  sources: [es-incibe-streaming-renewal-2024, es-incibe-streaming-extension-2023, pl-cert-phishing-kb-2026, ch-ncsc-links-2025, pt-gnr-phishing]
