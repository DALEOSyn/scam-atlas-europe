      colour_shape: >
        Sand arch with three ledger bars on deep indigo. Dark blue is the generic banking colour, so the
        shape carries the identity: no eagle, horse, lion, flame, star, leaf, box-with-slash, hexagon,
        ribbon or initial letter.
      typography: "Tracked uppercase in the system font; no serif crest lettering."
