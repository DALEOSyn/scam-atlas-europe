<!-- Scam Atlas: Europe. City backdrop: a steep Lisbon side street in warm sun, one facade with an original simple geometric tile pattern on its top floor and ground floor only, a rose plaster house, laundry on a line at the top, iron balconies outside the face band, stepped pavement; no tram, no funicular, no lettering, no sign, no copy of a historic tile design. Original artwork written as SVG code by the project's AI-assisted team, element by element; no image-generation model, auto-vectorised raster, tracing, stock or reference photo. Fictional, not a likeness of any real person, sign or brand. CC BY-SA 4.0. -->
