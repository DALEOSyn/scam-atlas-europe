# Recurring characters (GDD §2, CR-12). Scammers are never cast members.
# known_channel is the contact the player already has (staff directory, saved contact):
# the safe way to check a message that claims to come from this person.
cast:
  - id: adaeze
    name: "Adaeze Okafor-Lind"
    role: "Coordinator, Brussels"
    known_channel: { label: "Staff directory", detail: "Adaeze Okafor-Lind, Coordinator" }
    recurring: true
    notes: "Never asks for money or secrecy; she says so herself in the welcome email (home-01). Known channel for every work check (home-06)."
  - id: mateus
    name: "Mateus Ferreira"
    role: "Field partner"
    known_channel: { label: "Saved contact", detail: "Mateus (work phone)" }
    recurring: true
  - id: teo
    name: "Grandpa Teo"
    role: "Family back home"
    known_channel: { label: "Saved contact", detail: "Grandpa Teo (home)" }
    recurring: true
    notes: "Sharp and funny. Slips once in home-05 and asks you for help; teaches you later (Berlin, Rome)."
  - id: noor
    name: "Noor"
    role: "Cousin"
    known_channel: { label: "Saved contact", detail: "Noor" }
    recurring: true
  - id: alex
    name: "Alex"
    role: "Friend met on Wordswap"
    arc_character: true
    notes: "Friendship only. Lines are at most 25 words (balance.yaml, session: arc_line_max_words)."
  - id: jonas
    name: "Jonas"
    role: "Neighbour, Berlin"
    known_channel: { label: "Saved contact", detail: "Jonas (neighbour)" }
  - id: sanne
    name: "Sanne"
    role: "Guesthouse desk, Amsterdam"
    known_channel: { label: "Guesthouse desk", detail: "Sanne (guesthouse desk)" }
    notes: "Local, Amsterdam (GDD §22.1, STORY §2.3): 19, student, job hunting after a rent rise. Story scenes only: she never sends a scored message and no scam impersonates her in a scored scenario. Her mum (capable, rang Sanne's real number first) and her little brother stay off screen."
  # Paris (GDD §23.10, story bible §3.3). Margaux (front desk) is a directory entry, not cast.
  - id: solene
    name: "Solène Arbogast"
    role: "Director, Ruchelune (Paris)"
    known_channel: { label: "Ruchelune directory", detail: "Solène Arbogast, director" }
    notes: "Stretched thin, firm on the procedure card. Her real mailbox is misused in the boss (never her fault); a face and voice like hers are used on the boss video call."
  - id: bastien
    name: "Bastien Morel"
    role: "Accounts officer, Ruchelune (on leave)"
    known_channel: { label: "Ruchelune directory", detail: "Bastien Morel, accounts" }
    notes: "On leave for the long weekend; co-signs payments with Solène. Named in scam scripts (\"not even Bastien\"), never a speaker in scored scenarios."
  - id: ines
    name: "Inès Roussel"
    role: "Apprentice designer, Ruchelune (17)"
    known_channel: { label: "Saved contact", detail: "Inès (Ruchelune)" }
    notes: "Capable: spots the plumber fake herself (drill 3-3); her name is used in 3-5. Never the one who falls."
  # Warsaw (GDD §25.9, STORY §3.5). Ola (5-2) is a saved contact only, never cast (no from_cast, never drawn).
  - id: kasia
    name: "Kasia Wójcik"
    role: "Music student, Waymarker volunteer (Warsaw)"
    known_channel: { label: "Saved contact", detail: "Kasia (Warsaw)" }
    notes: "Selling half her flat before she moves. Her real Kettle account is taken over in 5-6 while she is at rehearsal (never her fault, never shown how); she is never the one who falls."
