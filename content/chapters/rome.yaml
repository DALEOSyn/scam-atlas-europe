# Chapter 6 — Rome. GDD §26. Slot 6, difficulty 3–4, boss 4. 8 scored scenarios (3 genuine = 37.5%),
# plus 1 drill (6-6, Davide's damage control) and 1 arc beat (Alex; the engine plays arc slot N by play
# position, STORY §1.4; this file carries slot 6, the default).
# Habit (H): "Verify through a number you already know. Caller ID and a familiar voice prove nothing."
# New patterns: spoofed-authority-call (6-3, 6-7's follow-up call, boss) and cloned-voice-family-emergency
# (6-2 genuine twin, 6-4, drill 6-6). Callbacks: multichannel-support-callback (6-7) and
# the family "new number" chat pattern (6-8; 6-5 is its genuine neighbour). Off-focus genuine: 6-1 (Davide).
# Mix (GDD §26.1): truth G G F · F G F F F(boss) (max 3 in a row); themes home 6-1, 6-5; family 6-2, 6-4,
# 6-8; authority 6-3, 6-7, boss (never adjacent); pressure parity genuine 3/3 vs fraud 5/5; genuine at
# difficulty 3 and 4; sender-or-link decoys in 6-3, 6-7, boss.
# Stop point after 6-3 (am/pm split). The arc beat sits in the morning, between 6-2 and 6-3 (producer, Q1).
# "112" appears only on the player's side: this rules card and the "Call the police yourself" outcomes
# (producer ruling, GDD §26.11 Q3). Never in a scam message, transcript or caller ID.
# Help card: layer 2 of every Rome debrief points to "Where to report and get help (Italy)"; its wording is
# in the chapter 6 sources file in docs/patterns ("Italy help card"). Real bodies appear only there and on
# the help screen (Red Line 1). The schema has no per-chapter help-card field yet, so this is the pointer.
# Story scenes (GDD §26.2, STORY §3.6, T-S4f): arrival before 6-1, the turn at the stop point after 6-3,
# Giulia shown safe straight after drill 6-6 (sensitive), and the resolution after the boss (sensitive).
# The resolution's variant flag rome_bank_called is set by every boss fall outcome.
