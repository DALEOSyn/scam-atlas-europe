# 0-4 "Unusual sign-in to your Kettle account. Locked in 30 min" (GDD §16). Fraud, difficulty 2.
# New mechanics: pusher, stress, pause, "the deadline was fake". Brief: see pattern below,
# §2 (fake security alert with a link, page asks for phone number and code).
# Red flags: the link (real name first, different owner: the subtle one), the page address, plus the
# code request and the 30-minute lock in the text. Decoys: the sender name (anyone can set "Kettle" as
# a text sender name) and the case reference.
# Look-alike host kettle-chat.example-verify.test is not yet in brands.yaml (Kettle has no look-alikes
# registered); flagged for ux-artist / sceptic-reviewer.
id: home-04-kettle-locked
chapter: home
role: standard
pattern: messenger-account-takeover-code
theme: account-security
learning_objectives: [LO-04, LO-05, LO-02]
difficulty: 2
is_fraud: true
device: sms
brands: [kettle]
cast: [noor]
pressure:
  timer: true
  levers: [urgency, fear]
  pusher:
    messages:
      - { at_seconds: 20, text: "Kettle: 20 minutes left. Confirm it's you to keep your chats." }
      - { at_seconds: 40, text: "Kettle: Final notice. Your account will be locked in 10 minutes." }

message:
  sender: { display: "Kettle", detail: "Sender name: Kettle" }
  body: |
    Kettle: Unusual sign-in to your account from a new device. Not you? Confirm it's you
    within 30 min or your account will be locked:
    kettle-chat.example-verify.test/keep
    Case K-55902
  request: open_link
  references: ["K-55902"]

inspectables:
  - target: sender.detail
    reveal: "The name a text shows can be faked, so it settles nothing."
    red_flag: false
    type: sender
  - target: link
    reveal: "kettle-chat.example-verify.test. Read the end: the owner part is example-verify.test, not kettle-chat.example. The real name at the start is borrowed."
    red_flag: true
    type: link
  - target: reference
    reveal: "K-55902 looks like a case number. Anyone can make one up; it proves nothing either way."
    red_flag: false
    type: reference

actions:
  - id: tap_keep_account
    label: "Tap the link and confirm it's you"
    kind: open_link
    next_beat: keep_page
    pressure_target: true
  - id: open_kettle_yourself
    label: "Open Kettle yourself and check linked devices"
    kind: verify_in_app
    outcome: no_new_device
  - id: report_kettle_sms
    label: "Report the text as spam"
    kind: report
    outcome: kettle_sms_reported
  - id: delete_kettle_sms
    label: "Delete the text"
    kind: delete
    outcome: kettle_sms_deleted

beats:
  - id: keep_page
    device: browser
    message:
      page: { address: "kettle-chat.example-verify.test/keep", title: "Kettle · Security check" }
      body: "To keep your account, enter your phone number and the 6-digit code we just sent you by text."
      request: share_code
    inspectables:
      - target: page.address
        reveal: "Still example-verify.test. Kettle's real site is kettle-chat.example."
        red_flag: true
        type: page_address
      - target: page.info
        reveal: "The connection is encrypted. Necessary, but never proof of who runs the site."
        red_flag: false
        type: padlock
    actions:
      - id: type_kettle_code
        label: "Type in your number and the code"
        kind: share_code
        outcome: kettle_taken
        pressure_target: true
      - id: close_keep_page
        label: "Close the page"
        kind: ignore
        outcome: left_keep_page

outcomes:
  kettle_taken:
    narrative: "An unknown device appears in Kettle's linked devices. That evening Noor emails you: \"Why did you send me a weird voting link on Kettle?\""
    recovery:
      - { step: log_out_unknown_devices, category: stop }
      - { step: turn_on_two_step, category: secure }
      - { step: report_to_police_online, category: report }
      - { step: warn_contacts, category: warn }
      - { step: reply_to_sender, category: harmful }
      - { step: wait_and_see, category: harmful }
    sets_flags: [kettle_hacked]
  no_new_device:
    narrative: "Kettle opens as normal. Linked devices: just your phone. No alert, no lock."
  kettle_sms_reported:
    narrative: "Reported. Your phone files the text under spam."
  kettle_sms_deleted:
    narrative: "Deleted. Thirty minutes pass. Your Kettle account is fine."
  left_keep_page:
    narrative: "You close the page without typing anything. Nothing happens."

debrief:
  variant: standard
  layer1:
    tell: "A 30-minute lock threat, and a link to example-verify.test."
    what_works: "Pause, then open Kettle yourself."
  layer2:
    message_flags:
      - "A 30-minute deadline plus reminders: pressure to act before you think. The deadline was fake. Nothing happened."
      - "It wants the code sent to you. Codes are only for the person who started the sign-in."
    notes: "Two-step verification (a PIN in the app's settings) makes a stolen code much less useful. Worth switching on in your real messaging app."
  device_tip: "In your real messaging app, look for Settings › Linked devices: it lists every device signed in to your account."
  habit_card: pressure-is-the-tell
  already_clicked:
    clicked: "Close the page and type nothing. If anything downloaded or you installed something, run a security scan or ask for help."
    entered_details: "Open Kettle's linked devices and log out any you don't know. Turn on two-step verification, warn your contacts and report it to the police."
  sources: [de-vzn-ghost-pairing-2026, pl-cert-vote-takeover-2026, nl-politie-whatsapp-takeover-2024, pl-cert-phishing-kb-2026, ie-ncsc-phishing-guide]
