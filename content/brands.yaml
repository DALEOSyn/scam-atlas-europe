  - id: waymarker
    name: "Waymarker Network"
    short_name: "Waymarker"
    sector: non-profit / player's employer
    role_in_game: >
      Fictional non-profit (not an EU body, never styled like one) that employs the player as a
      "trust inspector". Source of genuine work messages, and impersonated in chapter 0.
    sub_brands:
      - id: waymarker-desk
        name: "Waymarker Desk"
        purpose: Staff and IT portal (sign-in, travel documents, tickets). Faked in boss 0-6.
        domain: desk.waymarker-network.example
        logo: public/brands/waymarker-desk.svg
      - id: waymarker-mail
        name: "Waymarker mail"
        purpose: The player's work mailbox. Spoofed in 0-2 ("mailbox full").
        domain: mail.waymarker-network.example
    domain: waymarker-network.example
    email_addresses: ["adaeze.okafor-lind@waymarker-network.example", "it-desk@waymarker-network.example"]
    known_channels: "Staff directory inside the game (contact cards for Adaeze and the IT desk). No real numbers."
    palette:
      primary: "#22223B"       # ink
      on_primary: "#F2B24C"    # amber on ink 8.27:1
      accent: "#F2B24C"        # amber (top stone, light rays)
      secondary: "#EDE8DD"     # stone (lower stones in the mark)
      text_on_light: "#22223B" # 15.44:1 on white
    logo: { lockup: public/brands/waymarker.svg, mark: public/brands/waymarker-mark.svg }
    typography: "System UI sans, extra-bold, title case 'Waymarker' + tracked small caps 'NETWORK'."
    rationale:
      name: >
        A waymarker is the sign or cairn that keeps walkers on a trail. Ordinary English noun, not a
        typo or blend of any company name.
      colour_shape: >
        Stacked-stone cairn with the top stone lit amber, on an ink tile. No lantern, lighthouse,
        shield, padlock, eye or EU-style stars/blue.
      typography: "Generic system sans; no custom letterforms to imitate."
    checked_against: ["Lantern (VPN app)", "Lantern (child-safety programme)", "Lookout (mobile security)", "Waymark (US video ads)", "Waymarkly (waymarking app)", "WayMaker / Waymaker OS", "Waymap"]
    web_check: "Low. No product or company named 'Waymarker'; near names are in unrelated sectors (BRAND_CHECK §1)."
