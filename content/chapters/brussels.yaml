# Chapter 10 — Brussels (finale). GDD §30. Slot 10, difficulty 4–5, boss 5. 8 scored scenarios (3 genuine =
# 37.5%), plus drill 10-5 (Noor's friend) and, after the boss, the arc finale block (CR-43): close beat, reveal,
# arc damage control, the Backhaven recovery-agency test, Teo's chat and the red-flag timeline, dispatched by the
# engine from the saved arc state (GDD §30.6, R22(1)). No arc beat (slot 9 is the last, CR-43(f)).
# Habit (H): "Nobody who contacted you gets your screen, your codes or your account. Hang up or say no, then
# check on a number or app you already know, and ask someone."
# New patterns: remote-access-support-call (boss; 10-7 genuine twin) and money-mule-recruitment (10-4; drill 10-5).
# Callbacks (GDD §30.1, one per earlier habit family): payment-detail-change (10-1 genuine twin, 10-3),
# smishing-parcel-fee (10-2), the family-impersonation chat pattern (10-8), e-id-approval-on-call (10-6 genuine twin,
# boss beat 3), recovery-scam (arc ending C, the recovery-agency test).
# balance.yaml caps callbacks at 2 per chapter; the finale reviews every earlier habit (GDD §30.5), so the validator
# exempts arc_finale chapters from that cap (scripts/lib/rules.ts, T-3.12; for game-designer to confirm).
# Mix (GDD §30.1): truth G F F · F G G F F(boss), max run 3; themes supplier 10-1, 10-3; parcel 10-2; easy-money
# 10-4; work 10-6; support 10-7, boss; family 10-8 (never adjacent); pressure parity genuine 2/3 (10-1, 10-6
# honest timers) vs fraud 4/5 (10-2, 10-3, 10-8, boss); genuine at difficulty 4 and 5; sender-or-link decoys in
# 10-2, 10-3 and the boss. 10-4 is calm on purpose (a sensitive topic; Noor asks before anything is due).
# Help card: layer 2 of every Brussels debrief points to "Where to report and get help (Belgium)"; its wording is
# in the chapter 10 sources file in docs/patterns ("Belgium help card") and the BE rows of the where-to-report
# list. Real bodies appear only there and on the help screen (Red Line 1). The schema has no per-chapter
# help-card field yet, so this is the pointer.
# Story scenes (GDD §30.2, STORY §3.10: arrival, turn, the resolution list with the brussels_bank_called opening,
# one ending scene per arc ending, feelings, the Open Evening) are T-3.12 part 2. The validator does not require
# `scenes`, so it is left out until those scenes exist (part 2 adds
# scenes: { arrival: brussels-arrival, turn: brussels-turn, resolution: [brussels-resolution-open,
# brussels-ending-<variant>…, brussels-feelings, brussels-open-evening] }).
