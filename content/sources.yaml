    notes: "Lists CEO/BEC, invoice/supplier IBAN change, phishing/smishing/vishing, spoofed bank sites, romance, money-mule recruitment, fake jobs, relative-in-distress messages, investment scams. CAVEAT: still recommends 'padlock and https' as a safety sign. That is outdated as a trust signal (see pt-gnr-phishing, ch-ncsc-links-2025); cited in the email brief only as an example of that outdated advice."

