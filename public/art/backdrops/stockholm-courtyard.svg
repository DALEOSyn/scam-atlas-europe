<!-- Scam Atlas: Europe. City backdrop: a snowy Stockholm inner courtyard on a bright winter afternoon, warm-red and ochre plaster facades, warm lit windows, plain stepped candle arches in the top-floor windows only, a door with a lit fanlight, bikes under snow at the right, snow on the ground; no lettering, no flag, no star, no figure, no religious symbol, no e-ID or bank pictogram. Original artwork written as SVG code by the project's AI-assisted team, element by element; no image-generation model, auto-vectorised raster, tracing, stock or reference photo. Fictional, not a likeness of any real person, sign or brand. CC BY-SA 4.0. -->
