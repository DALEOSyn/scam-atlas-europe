  - id: eu-esas-ai-scams-factsheet-nl
    publisher: EBA, EIOPA, ESMA
    title: "Online financial frauds and scams in an AI world (NL edition)"
    url: https://www.eba.europa.eu/sites/default/files/2026-01/fa63af9a-bafd-4821-baee-48c7c8fb6490/Online%20financial%20frauds%20and%20scams%20in%20an%20AI%20world_NL.pdf
