# Damage-control options (CR-07). Each scenario outcome lists {step, category};
# the category (stop, secure, report, warn, harmful) depends on the scenario.
# feedback: shown after damage control when the step was a harmful pick (GDD §9): why it hurts and
# what works instead, never a judgement of the person. Steps are shared across scenarios, so keep
# these lines generic; a scenario outcome can override one with its own `feedback` on the
# {step, category} entry. Every harmful step needs a line here or in the scenario.
steps:
  - id: block_card_in_bank_app
    label: "Block your card in your banking app"
  - id: call_bank_known_number
    label: "Call your bank on the number on the back of your card"
  - id: change_password
    label: "Change the password, starting with the account that was hit"
  - id: turn_on_two_step
    label: "Turn on two-step sign-in"
  - id: report_to_police_online
    label: "Report it to the police (online in many cases)"
  - id: warn_contacts
    label: "Warn your contacts that messages from you may be fake"
  - id: reply_ask_money_back
    label: "Reply to the scammer and ask for your money back"
    feedback: "Asking for your money back feels fair, but it tells the scammer the number is live and invites a second scam. Contact your bank or the service yourself, on a number or app you already know."
  - id: pay_recovery_service
    label: "Pay a recovery service that promises to get the money back"
    feedback: "Wanting the money back is natural, and \"recovery\" offers are aimed at exactly that hope. Anyone who wants a fee up front to recover money is another scam. Your bank and the police are free."
  - id: wait_and_see
    label: "Wait and see whether anything happens"
    feedback: "Hoping it was nothing is a very human reaction. But the first minutes matter most: acting now limits what a scammer can still do with what they got."
  - id: tell_it_team
    label: "Tell your IT team straight away, through the contact you already have"
  - id: sign_out_everywhere
    label: "Sign out of every other session and remove devices you don't recognise"
  - id: log_out_unknown_devices
    label: "Open the app's linked-devices list and log out any device you don't recognise"
  - id: reregister_app_own_number
    label: "If you're locked out, set the app up again with your own number (it can take a while)"
  - id: refuse_codes_to_callers
    label: "Don't read out codes or approve payments for anyone who calls about it"
  - id: reply_to_sender
    label: "Reply to the message and ask them to undo it"
    feedback: "Replying feels like a way to fix it, but the sender is the scammer, and they won't undo anything. Secure the account yourself, then report it."
  - id: keep_quiet
    label: "Keep it to yourself and hope nobody notices"
    feedback: "Feeling embarrassed is normal, and it is what scammers count on. Telling the right people fast (your bank, your IT team or the service) is what limits the damage."
  - id: tell_it_via_desk
    label: "Tell IT through Waymarker Desk, opened yourself"
  - id: change_password_sign_out
    label: "Change the password and sign out other sessions"
  - id: call_bank_stop_payment
    label: "Call your bank on the number on your card and ask it to try to stop or recall the payment"
  # Amsterdam (GDD §22.6, T-3.4). Real reporting bodies are named only on the "Where to report" screen.
  - id: stop_paying
    label: "Stop paying: no last fee ever releases the money"
  - id: keep_evidence
    label: "Keep the chats, the site address and any payment records"
  - id: report_to_police
    label: "Report it to the police"
  - id: contact_fraud_helpline
    label: "Contact a fraud helpline for advice (see Where to report)"
  - id: tell_real_person
    label: "Call the real person on their saved number and tell them"
  - id: report_id_copy
    label: "Report the ID copy to the identity-fraud reporting point (see Where to report)"
  - id: tell_trusted_adult
    label: "Tell a parent or trusted adult now (if you're under 18)"
  - id: pay_second_request
    label: "Pay the second request so they leave you alone"
    feedback: "Wanting it to be over is natural, but a second request after the first payment is part of the same scam, and paying it only adds to the loss. Stop paying and call your bank now on the number on your card."
  - id: pay_last_fee
    label: "Pay the last fee to unlock your balance"
    feedback: "It feels like one more payment will get your money back, and that is exactly how the trap works: no fee ever releases it, and the amounts keep growing. Stop paying and call your bank on the number on your card."
  # Paris (GDD §23.9, T-3.5). Labels stay generic: real bodies are named only on the France help card.
  # GDD §23.9's `keep_evidence` is Amsterdam's step with a chat-and-site label, so Paris uses its own
  # `keep_transfer_evidence` (emails, bank details, transfer, times) instead of rewording Amsterdam's.
  - id: call_bank_recall_transfer
    label: "Call your bank at once on the number you already have and ask it to try to stop or recall the transfer for fraud"
  - id: warn_creditor_known_number
    label: "Warn the real landlord or supplier on the number you already have: they're being impersonated, and their mailbox may be misused"
  - id: file_complaint_police
    label: "File a complaint with the police (you can start online)"
  - id: keep_transfer_evidence
    label: "Keep the emails, bank details, transfer and times"
  - id: tell_management_known_channel
    label: "Tell your manager through the directory, not by replying"
  - id: check_pay_details_with_person
    label: "Check the pay details with the person directly and put the right ones back"
  - id: secure_mailbox_owner
    label: "Ask the person whose mailbox was used to change its password and turn on two-step sign-in"
  - id: wait_until_after_long_weekend
    label: "Wait until the office reopens after the long weekend"
    feedback: "Waiting for the office to reopen feels sensible, but the sooner you call, the better the chance of getting a transfer back. Call the bank now."
  # Warsaw (GDD §25.9, T-3.7). Labels stay generic: real bodies are named only on the Poland help card.
  - id: report_buyer_in_app
    label: "Report the buyer with the app's own report button"
  - id: report_account_in_app
    label: "Report the taken-over account in the app"
  - id: ask_buyer_to_cancel
    label: "Message the buyer and ask them to cancel it"
    feedback: "It feels like the quickest fix, but the 'buyer' is the scammer and won't undo anything. Block the card in your banking app first."
  - id: wait_for_money
    label: "Wait until the money arrives"
    feedback: "Hoping the payment is on its way is natural, but no money is coming, and every minute counts. Block the card now."
  - id: send_code_to_cancel
    label: "Send another code to cancel the payment"
    feedback: "A code only ever makes a payment; it can't cancel one. Call your bank on the number on your card instead."
  # Rome (GDD §26.10, T-3.8). keep_call_evidence, call_back_caller_number and call_back_text_number are Madrid's steps (GDD §24.10,
  # T-3.6), added here word for word because Rome may land first; keep one copy when both branches merge.
  # Labels stay generic: real bodies are named only on the Italy help card.
  - id: keep_call_evidence
    label: "Keep screenshots of the texts, the call log and the times"
  - id: call_back_caller_number
    label: "Call back the number that called you and ask them to send it back"
    feedback: "Wanting to fix it fast is natural, but the number that called you can be faked, so you can't tell whose line you'd reach. Call the number on your card instead."
  - id: call_back_text_number
    label: "Call the number from the text again and ask them to send it back"
    feedback: "Wanting to fix it fast is natural, but that number came with the fake text, so it reaches whoever sent it. Call the number on your card instead."
  - id: report_number_in_app
    label: "Block and report the number in Kettle"
  # Lisbon (GDD §27.10). `report_sticker` is common sense (no PT source, QRP §5.4).
  - id: report_sticker
    label: "Photograph the sticker or slip and report it in the parking app or to the city"
  - id: report_listing_or_host
    label: "Report the listing or host on the platform"
  - id: rescan_to_cancel
    label: "Scan the code again to cancel the payment"
    feedback: "It feels like undoing it, but the code leads to the same page. Block the card in your banking app first."
  - id: pay_second_deposit
    label: "Pay a 'refundable' deposit if they ask for one"
    feedback: "Wanting your money back is natural, but a second payment only adds to the loss. Call your bank instead."
  - id: keep_chatting_host
    label: "Keep chatting to the 'host' on Kettle to sort it out"
    feedback: "Wanting to sort it out with them feels reasonable, but the 'host' is the scammer and won't fix anything. Report them in the Roostwell app and call your bank."
  # Stockholm (GDD §29.10). go_offline, get_device_checked and let_caller_finish are reused by the Brussels
  # boss (§29.5). approve_again_to_cancel is the e-ID sibling of send_code_to_cancel and rescan_to_cancel.
  - id: go_offline
    label: "Turn on airplane mode and stop using the device for banking"
  - id: get_device_checked
    label: "Get the device checked before you use it for banking again"
  - id: approve_again_to_cancel
    label: "Approve another request to cancel the first one"
    feedback: "It feels like undoing it, but a new approval can let them in again. Call your bank instead."
  - id: let_caller_finish
    label: "Call them back so they can finish the 'check'"
    feedback: "They're the ones who got in. Hang up, go offline and call your bank."
