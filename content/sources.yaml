    notes: "Small 'address fee' that escalates; subscription sign-ups; voicemail and email lures; deliberate typos to dodge filters. Parcel services don't request prepayment."

  - id: de-zoll-phishing
    publisher: Zoll (German Customs)
    title: "Achtung vor Phishing-Mails und gefälschten Bescheiden"
    url: https://www.zoll.de/DE/Privatpersonen/Postsendungen-Internetbestellungen/Phishing-Mails-und-gefaelschte-Bescheide/phishing-mails-und-gefaelschte-bescheide_node.html
