    notes: "Stalkerware can be installed quickly or come preinstalled on a phone you're given; set up phones yourself; SIM PIN and strong screen lock; don't share codes; be wary of being urged to root a device; protect email/social/cloud accounts, review security notifications and logins from unknown devices, enable 2FA; share only what is necessary; accept only people you know. Does not list signs of a monitored phone or cover doxxing by name."

