  # ---------------------------------------------------------------- Poland (T-2.5)
  - id: pl-cert-vote-takeover-2026
    publisher: CERT Polska (NASK)
    title: "Uważaj na prośby o głosowanie od znajomych (advisory 134/2026)"
    url: https://moje.cert.pl/komunikaty/2026/134/uwazaj-na-prosby-o-glosowanie-od-znajomych/
    published: 2026-08-02
    accessed: 2026-11-18
    region: PL
    tier: 2
    used_for: [messenger-account-takeover-code, help-where-to-report-en]
    notes: "English gloss: 'Beware of vote requests from friends'. Hijacked friends' messenger accounts ask you to vote; you scan a QR code on a fake page or read out a code, which pairs another device to your account. Advice: unlink unknown devices; report at incydent.cert.pl or via the mObywatel app ('Bezpiecznie w sieci'); suspicious SMS to 8080."
  - id: pl-cert-phishing-kb-2026
    publisher: CERT Polska (NASK)
    title: "Phishing: jak rozpoznać oszustwo (knowledge base, 'Bezpieczeństwo osobiste')"
    url: https://wiedza.cert.pl/bezpieczenstwo-osobiste/rozpoznanie-phishingu/
    published: 2026-09-02 (last updated)
    accessed: 2026-11-18
    region: PL
    tier: 2
    used_for: [messenger-account-takeover-code, it-portal-credential-phishing, card-phishing-payment-failed, multichannel-support-callback, help-where-to-report-en]
    notes: "Title shortened. Fake payment forms asking for card number, expiry and CVV, often for a small extra fee; time pressure (blocked account, returned parcel); fake login panels look identical, so check the domain; requests for SMS codes: read the operation description before approving; a password manager that won't autofill is a warning; passkeys/FIDO2 best. Victim steps: block with the bank; change reused passwords; log out sessions, enable 2FA, check linked devices; police report; warn contacts."
  - id: pl-cert-fake-consultants
    publisher: CERT Polska (NASK)
    title: "Fałszywi konsultanci (knowledge base)"
    url: https://cert.pl/baza-wiedzy/falszywi-konsultanci/
    published: n/d (page footer (c) 2026 NASK)
    accessed: 2026-11-18
    region: PL
    tier: 2
    used_for: [it-portal-credential-phishing, multichannel-support-callback, help-where-to-report-en]
    notes: "English gloss: 'Fake consultants'. Callers posing as bank or institution staff; caller ID and caller names can be spoofed; 'safe account' transfers; requests to install remote-access software. Advice: hang up and call back on the number from the official site or app; never let anyone remotely control your device."

