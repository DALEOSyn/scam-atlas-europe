    short_name: "Larchwick"
    sector: retail bank (player's own bank)
    role_in_game: >
      The player's bank and the `banking` device: notifications, card controls, the payee-name check,
      and the brand spoofed in "safe account" and in-thread scenarios (Madrid, Stockholm).
    domain: larchwick-bank.example
    app_name: "Larchwick app"
    sms_sender_id: "LARCHWICK"
    known_channels: "The number on the back of your in-game card (shown masked), and the Larchwick app."
    palette:
      primary: "#2D2A6E"       # deep indigo
      on_primary: "#FFFFFF"    # 12.59:1
      accent: "#EAD9B5"        # sand, 9.05:1 on primary
      text_on_light: "#2D2A6E"
