    notes: "Dutch name for Verification of Payee, required for digital SEPA transfers in 41 SEPA countries incl. cross-border. Match: no warning, green check mark. Close match: warning SHOWING the name linked to the IBAN. No match: warning WITHOUT the correct name, withheld to protect account holders' privacy (so people can't use fake names to look up the real one). Cannot be verified (e.g. a very new account): verify name and IBAN another way. The payer can cancel, correct or confirm unchanged; after a warning the bank may not block it. Says the check reduces entry errors and gives some protection against invoice fraud; does NOT say a match makes a request legitimate; does not mention business accounts."

  - id: be-febelfin-vop-faq
    publisher: Febelfin (Belgian financial sector federation)
    title: "FAQ: Verification of the beneficiary's name"
    url: https://febelfin.be/en/themes/fraud-security/faq-verification-of-the-beneficiary-s-name
