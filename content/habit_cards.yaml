# Habit cards (GDD §11, UI_SPEC §9.1): one per learning objective.
# STUB for T-2.2: titles from docs/LEARNING_OBJECTIVES.md; the game-designer owns the wording.
# Example rule (GDD §17 T-2.4b ruling 6): an example uses only material the player has already seen where
# the card first appears (or none); never a later scenario's pretext or domain; never a scam domain in a
# card shown on a genuine debrief (a drill about a quoted scam, like 1-4, is not a genuine debrief).
cards:
  - id: read-the-link
    lo: LO-02
    title: "Read the link before you tap"
    habit: "Hold or hover to see where a link goes, then read the end of the address: that part names the owner. A brand name anywhere else proves nothing."
    example: "waymarker-it-support.example has Waymarker in it, but Waymarker's own address is waymarker-network.example."
    already_clicked: "Close the page. If you typed anything, change that password or block that card now."
  - id: open-it-yourself
    lo: LO-03
    title: "Open it yourself"
    habit: "Go to the app or the address you already know, not the link in the message."
    example: "\"Mailbox full\"? Open your mail yourself. If storage really is full, it says so there, and you can fix it there."
    already_clicked: "Typed a password? Change it from the real site. Gave card details? Block your card in your banking app and call your bank on the number on your card."
  - id: who-really-sent
    lo: LO-01
    title: "Who really sent this?"
    habit: "Look at the address or number behind the name. A familiar name or logo proves nothing: both are easy to copy. A fake text can even land in your bank's real thread."
    example: "A text signed \"your bank\" from a number you don't know: the name is easy to copy, the number behind it tells you more."
    already_clicked: "Close it and type nothing. If you already did, change that password from the real app or site."
  - id: pressure-is-the-tell
    lo: LO-04
    title: "Pressure is the tell"
    habit: "A countdown, a threat or a string of reminders is a reason to slow down. Pause, then check in the app yourself."
    example: "\"Locked in 30 minutes\"? Open the app yourself: if something is really wrong, it will show there."
    already_clicked: "Stop where you are. If you typed a password or a code, secure that account first."
  - id: stop-the-damage-first
    lo: LO-16
    title: "Stop the damage first"
    habit: "After a slip, do the step that stops the damage first: block the card, or change the stolen password. Then secure, report and warn."
    example: "Card number typed into a fake page? Block the card in your banking app before anything else."
    already_clicked: "Never pay anyone who promises to get your money back. Your bank and the police are free."
  - id: calm-not-paranoid
    lo: LO-17
    title: "Calm, not paranoid"
    habit: "Most messages are fine. Save your extra checks for the ones that ask for money, data, codes or approval, and ask: did I start this?"
    example: "You tapped \"forgot password\" a minute ago, and the reset email arrives. That one you started."
    already_clicked: "Reported a genuine message by mistake? No harm done. Let the sender know through a channel you trust."
  - id: ask-someone
    lo: LO-18
    title: "Ask someone"
    habit: "Before acting on an odd request, check with someone you trust, on a contact you already have. And be that someone for others."
    example: "\"IT\" is chasing you on three channels? Message Adaeze from the staff directory first."
    already_clicked: "Tell someone now, even if it feels awkward. Early help limits the damage."
  - id: codes-are-only-for-you
    lo: LO-05
    title: "Codes are only for you"
    habit: "A code sent to your phone is a key. Never pass it on or type it into a page from a message, whoever asks. Read what the code says it is for."
    example: "The code text says it registers your account on a new device, and you aren't setting one up? Then it isn't for you to pass on."
    already_clicked: "Passed a code on? Secure that account now from the real app, and warn your contacts another way."
  - id: hang-up-call-back
    lo: LO-08
    title: "Hang up, call back"
    habit: "An unexpected call from your bank, the police or any official? Hang up, then call back on a number you find yourself, like the one on your card. Caller ID proves nothing, and no real bank asks you to move your money to keep it safe."
    example: "The phone shows your bank's name? End the call, then dial the number on the back of your card."
    already_clicked: "Read out a code or approved something? Call your bank now on the number on your card and ask it to block the card and try to stop or recall the payment."
  # Amsterdam (GDD §22.5; titles from docs/LEARNING_OBJECTIVES.md, LO-06 retitled by producer answer 4).
  - id: call-the-number-you-know
    lo: LO-07
    title: "Call the number you already know"
    habit: "Asked by message for money you didn't expect, or to an account that isn't theirs? Call a number you already had. For requests you didn't agree in person."
    example: "\"Noor\" on a new number wants €84 today? A call from you, on Noor's saved number."
    already_clicked: "Call your bank now on the number on your card (under 18: with a parent, carer or another adult you trust). Don't pay a second request."
  # R19(5) (Brussels, GDD §30.11): the example and already-clicked lines gain Brussels' account-lending case;
  # the habit sentence is unchanged.
# R27, T-3.13g (psych): already_clicked is one de-duplicated line in MMR §7 order, opening "It's not too late:".
# Its last sentence is the money-mule case (money arrived in your account): confirmed by fraud-researcher
# 2026-11-19 (the two EU police agency money-mule flyers in sources.yaml: stop transferring money, notify your bank);
# cited on every scenario that shows this card.
  - id: easy-money-costs-you
    lo: LO-12
    title: "Easy money costs you"
    habit: "A real job pays you. If a 'job' wants a deposit, a top-up, a fee or a fine before you can earn or withdraw, or your ID copy before any contract, stop and talk to someone you trust."
    example: "A job you never applied for wants your ID by chat? Look the agency up yourself. Someone online wants to 'use your account for a few transfers'? Say no and ask someone."
    already_clicked: "It's not too late: paid, or shared your login or card? Stop: no last fee releases the money. Tell someone you trust today, call your bank on the number on your card, then change your login. Keep the chats. Money arrived in your account? Don't pass it on; tell your bank."
  - id: check-who-gets-the-money
    lo: LO-06
    title: "Check who gets the money"
    habit: "New or different account, or urgent or secret? Call the person on a number you already have. Name doesn't match? Stop. Matches? Still call: it only shows whose account it is. At work, keep the two-person sign-off."
    example: "Paying a bill or a new payee? Type the name from your own papers, not the message. No papers? Call first."
    already_clicked: "Paid already? Call your bank now on the number you already have and ask it to try to stop or recall the payment. Then tell the real person, on a number you already have."
  # Warsaw (GDD §25.9). First shown at 5-3; the example uses no scam domain.
  - id: stay-on-the-platform
    lo: LO-10
    title: "Stay on the platform"
    habit: "Keep the deal and the money inside the marketplace app you opened yourself. If you've been paid, it shows there. Receiving money never needs your card details or bank login."
    example: "A buyer you've never met says they've paid and sends a link to collect it? Open Swaploft yourself: real payments show there."
    already_clicked: "Typed card details? Block the card in your banking app now and call your bank on the number on your card. Typed a bank login? Call the bank and change the password from the real app."
  - id: check-before-you-pay
    lo: LO-11
    title: "Check before you pay"
    habit: "Before you pay for a stay, a room or an offer, find it yourself in the platform's app or site, and pay there, where you're protected. Too cheap, 'many people interested' or 'can't show it' are reasons to slow down."
    example: "A great flat in an ad? Search for it in the Roostwell app yourself. If you can't find it there, don't pay for it."
    already_clicked: "Paid outside the app? Call your bank now on the number on your card; for a card payment, ask about a chargeback. Report the listing in the app."
  # Stockholm (GDD §29.10). only-approve-what-you-started is first shown on 9-1 (a genuine debrief: the
  # example names no scam domain); nobody-needs-your-screen is shared with Brussels (first earned in
  # Stockholm if played).
  - id: only-approve-what-you-started
    lo: LO-09
    title: "Only approve what you started"
    habit: "Approve a sign-in, signature or QR login only when you opened the app or site yourself, chose what to do, and the request names it. Whoever is on the phone, hang up and call your bank on the number on your card or in its app."
    example: "You open a site, tap 'Log in with Gatewren', and the request names that site: approve. A caller asks you to open Gatewren: deny and hang up."
    already_clicked: "Approved one you didn't start? Call your bank now on the number on your card; banks answer day and night. Then report it to the police."
  - id: nobody-needs-your-screen
    lo: LO-15
    title: "Nobody needs your screen"
    habit: "Never install an app or share your screen for someone who contacted you. Hang up and contact the company yourself, through its own app, card or website."
    example: "A 'support' caller wants you to install a helper app and read out its code? Hang up and open the company's own app yourself."
    already_clicked: "Installed something for them? Take the device offline (wifi off, cable out or airplane mode), call your bank from another phone if you can, change your passwords from another device, and get the device checked."
  # Dublin (GDD §28.10, LO-13 v3.1). First shown at 8-2; the example uses no scam domain or firm name.
  - id: if-its-guaranteed-and-high-its-not
    lo: LO-13
    title: "If it's guaranteed and high, it's not"
    habit: "Before you pay, look the firm up yourself on the regulator's register, and contact it only through the details the register gives. Not on the register? Don't pay, even if the warning list is clean. If you're asked to pay to get your money out, or back: stop."
    example: "A famous face recommends a platform in an ad? Find the firm on the register yourself. Not there? Don't pay."
    already_clicked: "Paid already? Stop paying, call your bank now on the number on your card, keep the chats, and report the firm. Ignore anyone who offers to get it back for a fee."
  # Brussels (GDD §30.11, LO-14; T-3.12). First shown in the finale block (close beat and Teo's chat); the
  # example uses no scam name, platform or amount. Sourced to be-fsma-dating-platforms-2026 (another app; steering
  # to money; never send money to someone only met online) and be-police-romance-2026 (photo check). Cards have no
  # sources field; the citations are on the close beat and Teo's chat.
  - id: a-real-friend-never-needs-your-money
    lo: LO-14
    title: "A real friend never needs your money"
    habit: "Someone you've only met online moves you to another app or steers you to money? Tell someone you trust, do a photo check, and never send money."
    example: "A new online friend's 'easy profits' come with an invitation? Ask someone before you reply."
    already_clicked: "Sent money already? Stop paying, tell someone you trust, call your bank on the number on your card, and keep the chat history. Ignore anyone who offers to get it back for a fee."
