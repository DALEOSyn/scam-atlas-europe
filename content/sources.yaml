# content/sources.yaml: source registry (Red Line 6). Owner: fraud-researcher.
# Excluded from redline:lint because real sources carry real URLs; URLs are schema-checked (https only).
# Rework 1 (2026-11-18), after sceptic FAIL: tiers fixed, used_for regenerated from actual citations, new sources added.
# Every entry was opened (fetched) in the research session of 2026-11-18.
#
# Fields:
#   id         stable id used in docs/patterns/*.md
#   publisher  organisation that published the source
#   title      title as published (original language, English gloss in notes where useful)
#   url        the exact URL opened
#   published  publication / last-updated date as shown by the source ("n/d" if none shown)
#   accessed   date the researcher opened it
#   region     EU | country code (ISO 3166-1 alpha-2) | CH (non-EU, supporting only)
#              | US (MITRE ATT&CK only: taxonomy reference, never evidence of European prevalence; T-R.1)
#   tier       ranks the *publishing entity*, not the network it belongs to:
#                1 = EU institution or agency
#                2 = national CERT / cybersecurity agency
#                3 = other national public authority (police, customs, telecom regulator, central bank),
#                    national consumer body, or banking association
#                4 = NGO, research or news (supporting only, never the sole source)
#                    MITRE ATT&CK entries (id prefix int-mitre-) are also tier 4: a taxonomy/reference,
#                    never a prevalence source (the schema allows tiers 1-4 only).
#   used_for   docs that actually cite the id. Labels:
#                email-phishing-credential | smishing-parcel-fee
#                messenger-account-takeover-code | it-portal-credential-phishing
#                card-phishing-payment-failed | multichannel-support-callback   (added T-2.5, 2026-11-18)
#                MAP-ch0..MAP-ch10 | MAP-missing | MAP-crosscutting | WHERE_TO_REPORT
#                help-where-to-report-en   (docs/patterns/where-to-report.draft.en.yaml for now; moves to content/help/ once the linter exemption exists; T-2.5)
#                campaign-catalogue   (docs/patterns/THREAT_CATALOGUE.md, backlog research T-R.1, 2026-11-18)
#                berlin-arc-alex-01 | arc   (Alex friendship-manipulation arc beats, GDD §10; added T-2.4b, 2026-11-18)
#                messenger-family-impersonation | task-job-scam   (chapter 2 Amsterdam briefs; added phase 3, 2026-11-19)
#                ceo-fraud-bec | payment-detail-change   (chapter 3 Paris briefs; added phase 3, 2026-11-19)
#                spoofed-authority-call | cloned-voice-family-emergency   (chapter 6 Rome briefs; T-3.8r, 2026-11-19)
#                rental-offplatform-payment | qr-sticker-parking   (chapter 7 Lisbon briefs; T-3.8r, 2026-11-19)
#                bank-safe-account-call | marketplace-collect-payment-link | hijacked-friend-payment-code
#                  (chapters 4 Madrid and 5 Warsaw briefs; added T-3.6r, 2026-11-19)
#              An empty list means provenance only: not cited directly, kept because another entry's
#              date or content relies on it.
#   notes      what the source actually supports; caveats

sources:

  # ---------------------------------------------------------------- EU level
  - id: eu-enisa-etl-2025-press
    publisher: ENISA (EU Agency for Cybersecurity)
    title: "EU consistently targeted by diverse yet convergent threat groups (ENISA Threat Landscape 2025 press release)"
    url: https://www.enisa.europa.eu/news/eu-consistently-targeted-by-diverse-yet-convergent-threat-groups
    published: 2025-10-01
    accessed: 2026-11-18
    region: EU
    tier: 1
    used_for: [email-phishing-credential, MAP-ch0, campaign-catalogue]
    notes: "Phishing (incl. vishing, malspam, malvertising) ~60% of observed intrusion cases, period 2024-07-01..2025-06-30. AI-supported phishing reported as >80% of observed social-engineering activity by early 2025 (third-party figure; not for on-screen use). T-R.1 re-read: hacktivism almost 80% of incidents; DDoS 77% of reported incidents; ransomware 'the most impactful threat in the EU'; intensified abuse of critical dependency points such as the digital supply chain; more attacks on mobile devices, focused on outdated devices. No mention of ClickFix or infostealers on this page."

  - id: eu-enisa-etl-2026
    publisher: ENISA
    title: "ENISA Threat Landscape 2026"
    url: https://www.enisa.europa.eu/sites/default/files/2026-09/ENISA%20Threat%20Landscape%202026_Final.pdf
    published: 2026-09
    accessed: 2026-11-18
    region: EU
    tier: 1
    used_for: [email-phishing-credential, smishing-parcel-fee, it-portal-credential-phishing, multichannel-support-callback, MAP-ch0, MAP-ch1, MAP-ch9, campaign-catalogue]
    notes: "Period 2025-01-01..2025-12-31, 8,257 incidents. Phishing = 77.8% of social-engineering intrusion vectors. Voice phishing impersonating IT staff to obtain SSO credentials and MFA codes (cited in it-portal-credential-phishing; T-2.5). Rise in smishing; large-scale smishing impersonating logistics providers and public administration, mainly against Germany (also FR, IE, PL, LT). Quishing listed; no MFA-fatigue / push-bombing content (cited in MAP-ch9 for that absence). AI used to tailor phishing at scale. Country fraud-concentration shares and the EBA EUR 4.2bn figure appear in this report but are NOT used: they rank countries without a usable denominator, and the 4.2bn is total EEA payment fraud (see eu-eba-ecb-fraud-2025). Read to char 100000 of ~105000. T-R.1 re-read (catalogue): phishing kits and Phishing-as-a-Service popularised; ClickFix 'increasing'; fake CAPTCHA pages deliver infostealers; malvertising listed; ransomware 47.3% of financially motivated claims with a shift to data exfiltration; data breaches 36% of financially motivated claims; DDoS 51.3% of incidents, ideology-driven 57.3%; compromised libraries/npm packages and browser extensions; an Android campaign abusing accessibility services; 'MFA abuse' and vishing for MFA codes (no push-bombing by name); device-code phishing incl. via trusted messengers; stolen OAuth tokens; LLM-made media for influence campaigns. NOT found: SIM swap, credential stuffing by name, AiTM by name, IoT/botnets, deepfakes by name, fake updates."

  - id: eu-europol-iocta-2026
    publisher: Europol
    title: "Internet Organised Crime Threat Assessment (IOCTA) 2026"
    url: https://www.europol.europa.eu/cms/sites/default/files/documents/IOCTA-2026.pdf
    published: 2026-04-28
    accessed: 2026-11-18
    region: EU
    tier: 1
    used_for: [email-phishing-credential, it-portal-credential-phishing, task-job-scam, MAP-ch0, MAP-ch7, MAP-ch8, MAP-ch10, MAP-missing, MAP-crosscutting, campaign-catalogue, rental-offplatform-payment, marketplace-collect-payment-link]
    notes: "Fraud is 'the fastest-growing area of organised crime'. Investment fraud especially prevalent, increasingly via ads on very large online platforms. Romance and tech-support among most common typologies reported by Member States. AI-assisted impersonation of bank helpdesk and law-enforcement staff. Malvertising for fake accommodation/merchandise listings. Minors drawn into laundering via 'get-rich' social-media schemes. Victims 'relentlessly re-victimised'. Publication date from eu-eucrim-iocta-2026. T-R.1 re-read (catalogue): 'financial sexual extortion continues to surge'; offenders target children on gaming platforms; violent online networks groom children (8-17) with love-bombing; voice chat bots pre-screen victims 'at industrial volume'; infostealers 'a key enabler'; SIM swapping mentioned only in passing (collectives); minors may launder by renting out wallets or receiving crypto 'gifts'. NOT found: ticket or charity scams, 'deepfake' by name."

