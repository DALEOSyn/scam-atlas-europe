# Every raster image in public/ must be listed here (redline:lint warns otherwise).
# Raster images can carry logos or text the linter cannot read, so each entry
# records where it came from and that it passed the brand-resemblance review.
# Vector files (SVG) are scanned as text and need no entry.
#
# - path: brands/paketpilot-logo.png     # relative to public/
#   origin: "Drawn by ux-artist for this project"
#   licence: CC BY-SA 4.0
#   review: "sceptic-reviewer PASS, T-x.y"
assets:
  - path: icon-192.png
    origin: "Rendered by scripts/build-icons.ts from public/icon.svg (the project's own vector icon); no stock or generated image"
    licence: MIT
    review: "pending sceptic-reviewer, T-4.6"
  - path: icon-512.png
    origin: "Rendered by scripts/build-icons.ts from public/icon.svg (the project's own vector icon); no stock or generated image"
    licence: MIT
    review: "pending sceptic-reviewer, T-4.6"
  - path: icon-maskable-512.png
    origin: "Rendered by scripts/build-icons.ts from public/icon-maskable.svg (the project's own vector icon); no stock or generated image"
    licence: MIT
    review: "pending sceptic-reviewer, T-4.6"
  - path: touch-icon-180.png
    origin: "Rendered by scripts/build-icons.ts from public/icon-maskable.svg (the project's own vector icon); no stock or generated image"
    licence: MIT
    review: "pending sceptic-reviewer, T-4.6"
